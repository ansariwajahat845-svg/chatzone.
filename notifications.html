<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8b5cf6"><title>Notifications - ChatZone 💬</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}:root{--p:#7c3aed;--light:#f3e8ff;--bg:#f8f7fc;--s:#fff;--t:#251b35;--m:#786d86;--b:#eee5f8}html[data-theme=dark]{color-scheme:dark;--p:#a78bfa;--light:#302344;--bg:#171222;--s:#211a30;--t:#f5efff;--m:#b5a7cb;--b:#403054}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial;padding-bottom:75px}header{background:var(--s);border-bottom:2px solid var(--p);position:sticky;top:0}.head,main{max-width:760px;margin:auto;padding:14px}.head{display:flex;align-items:center;gap:12px}.logo{font-size:24px}.heading{flex:1}h1{font-size:20px;color:var(--p);margin:0}#status,.time,small{font-size:11px;color:var(--m)}button{cursor:pointer}.iconbtn,.refresh,.action{border:0;border-radius:12px;padding:10px;background:var(--light);color:var(--p);font-weight:bold}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toolbar{margin-bottom:12px}.note{display:flex;gap:12px;background:var(--s);border:1px solid var(--b);border-left:4px solid var(--p);border-radius:15px;padding:13px;margin-bottom:10px}.note.unread{box-shadow:0 0 0 1px #8b5cf633}.noteicon{width:42px;height:42px;display:grid;place-items:center;background:var(--light);border-radius:13px;font-size:22px;flex-shrink:0}.content{flex:1;min-width:0}.name{font-size:14px;font-weight:bold;margin:3px 0 6px}.desc{font-size:13px;color:var(--m);line-height:1.5;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:20px;padding:9px 13px;font-weight:bold;font-size:12px}.open,.accept{background:var(--p);color:white}.decline{background:var(--light);color:var(--t)}.empty,.loading,.error{background:var(--s);border:1px solid var(--b);border-radius:15px;text-align:center;padding:28px;color:var(--m)}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--b);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.bottom a{flex:1;max-width:150px;text-align:center;padding:9px 3px;color:var(--m);text-decoration:none;font-size:11px}.bottom a span{display:block;font-size:19px}.bottom a.active{color:var(--p);font-weight:bold}#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2b2038;color:white;padding:11px 16px;border-radius:22px;display:none;z-index:10}.replybox{margin-top:10px}.replybox textarea{width:100%;min-height:65px;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:10px;font:14px Arial}.replybox button{margin-top:7px}.reply-target{background:var(--light);padding:12px;border-radius:12px;margin-bottom:12px;font-size:13px}
</style></head><body><header><div class="head"><div class="logo">🔔</div><div class="heading"><h1>Notifications</h1><div id="status">Connecting to ChatZone...</div></div><button class="iconbtn" onclick="loadNotifications()">↻</button><button class="iconbtn" onclick="goBack()">←</button></div></header><main><div class="topline"><h2>Your notifications</h2><button class="refresh" onclick="loadNotifications()">Refresh</button></div><div class="toolbar"><button class="action" onclick="markAllRead()">✓ Mark all as read</button></div><div id="replyTarget" class="reply-target" style="display:none"></div><div id="replyBox" class="replybox" style="display:none"><textarea id="replyText" maxlength="1000" placeholder="Write your reply to the story..."></textarea><button class="btn open" onclick="sendNotificationReply()">Send reply</button><button class="btn decline" onclick="cancelReply()">Cancel</button></div><div id="mainContent"><div class="loading">Loading notifications...</div></div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="private.html"><span>💬</span>Private</a><a href="mehfil.html"><span>👥</span>Mehfil</a><a href="profile.html"><span>👤</span>Profile</a><a href="notifications.html" class="active"><span>🔔</span>Notifications</a></nav><div id="toast"></div>
<script>
"use strict";const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co",SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8",db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let currentUser=null,busy=false,channel=null,dbRows=[],requestRows=[],messageRows=[],peopleById={},replyRecipient=null,replyStoryId=null;
function $(id){return document.getElementById(id)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function goBack(){history.length>1?history.back():location.href="index.html"}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',2600)}function ago(v){if(!v)return'';let d=Date.now()-new Date(v).getTime();if(!Number.isFinite(d)||d<0)return'';if(d<60000)return'Just now';if(d<3600000)return Math.floor(d/60000)+' min ago';if(d<86400000)return Math.floor(d/3600000)+' hr ago';return new Date(v).toLocaleDateString()}function pname(p){return p?.name||p?.username||'ChatZone User'}function seenKey(){return'chatzone_seen_notifications_'+(currentUser?.id||'guest')}function getSeen(){try{return new Set(JSON.parse(localStorage.getItem(seenKey())||'[]'))}catch{return new Set()}}function markSeen(t,id){let s=getSeen();s.add(t+':'+id);try{localStorage.setItem(seenKey(),JSON.stringify([...s]))}catch{}}function updateCount(){let s=getSeen(),n=dbRows.filter(x=>!x.is_read).length+requestRows.filter(x=>!s.has('request:'+x.id)).length+messageRows.filter(x=>!s.has('message:'+x.id)).length;$('status').textContent=n?n+' unread notification'+(n===1?'':'s'):'You\'re all caught up'}function openChat(uid,type,id){if(!uid)return toast('Chat user is missing');if(type&&id)markSeen(type,id);location.href='private-chat.html?user_id='+encodeURIComponent(uid)}
function cardDb(n){let t=String(n.type||'').toLowerCase(),story=t==='story_reply'||t==='story-reply',title=story?'Story reply':({like:'New like',post_like:'New like',comment:'New comment',follow:'New follower',message:'New message',private_message:'New private message',friend_request:'New request'})[t]||'ChatZone notification';return `<article class="note ${n.is_read?'':'unread'}"><div class="noteicon">${story?'💬':t.includes('like')?'❤️':t.includes('comment')?'💬':t.includes('follow')?'👤':'🔔'}</div><div class="content"><div class="name">${title}</div><div class="desc">${esc(n.message||'')}</div><div class="time">${esc(ago(n.created_at))}</div><div class="actions">${story?`<button class="btn open" data-reply="${esc(n.sender_id||'')}" data-story="${esc(n.story_id||'')}">↩ Reply</button>`:''}${!n.is_read?`<button class="btn decline" data-read="${esc(n.id)}">Mark read</button>`:''}</div></div></article>`}
function cardRequest(r){return `<article class="note"><div class="noteicon">👤</div><div class="content"><div class="name">Private chat request</div><div class="desc"><b>${esc(pname(peopleById[r.sender_id]))}</b> sent you a private chat request.</div><div class="time">${esc(ago(r.created_at))}</div><div class="actions"><button class="btn accept" data-accept="${esc(r.id)}">Accept</button><button class="btn decline" data-decline="${esc(r.id)}">Decline</button></div></div></article>`}
function cardMessage(m){return `<article class="note"><div class="noteicon">💬</div><div class="content"><div class="name">New private message</div><div class="desc"><b>${esc(pname(peopleById[m.sender_id]))}</b>: ${esc(m.content||m.message||'Sent you a message')}</div><div class="time">${esc(ago(m.created_at))}</div><div class="actions"><button class="btn open" data-chat="${esc(m.sender_id)}" data-mid="${esc(m.id)}">Open chat</button></div></div></article>`}
async function loadNotifications(){if(busy||!currentUser)return;busy=true;try{let [n,r,m]=await Promise.all([db.from('notifications').select('id,user_id,sender_id,type,message,is_read,created_at,story_id').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(100),db.from('private_requests').select('id,sender_id,receiver_id,status,created_at').eq('receiver_id',currentUser.id).eq('status','pending').order('created_at',{ascending:false}).limit(100),db.from('private_messages').select('id,sender_id,receiver_id,content,message_type,media_url,created_at').eq('receiver_id',currentUser.id).neq('sender_id',currentUser.id).order('created_at',{ascending:false}).limit(100)]);if(n.error)throw n.error;if(r.error)throw r.error;if(m.error)throw m.error;dbRows=n.data||[];requestRows=r.data||[];messageRows=m.data||[];let ids=[...new Set([...dbRows.map(x=>x.sender_id),...requestRows.map(x=>x.sender_id),...messageRows.map(x=>x.sender_id)].filter(Boolean))];peopleById={};if(ids.length){let p=await db.from('profiles').select('id,username,name,avatar_url').in('id',ids);if(p.error)throw p.error;(p.data||[]).forEach(x=>peopleById[x.id]=x)}updateCount();let items=[...dbRows.map(row=>({k:'db',row,ts:Date.parse(row.created_at)||0})),...requestRows.map(row=>({k:'req',row,ts:Date.parse(row.created_at)||0})),...messageRows.map(row=>({k:'msg',row,ts:Date.parse(row.created_at)||0}))].sort((a,b)=>b.ts-a.ts);$('mainContent').innerHTML=items.length?items.map(x=>x.k==='db'?cardDb(x.row):x.k==='req'?cardRequest(x.row):cardMessage(x.row)).join(''):'<div class="empty">✨ You are all caught up.</div>';document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>openReply(b.dataset.reply,b.dataset.story));document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>markRead(b.dataset.read));document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat,'message',b.dataset.mid));document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>requestAction(b.dataset.accept,'accepted'));document.querySelectorAll('[data-decline]').forEach(b=>b.onclick=()=>requestAction(b.dataset.decline,'declined'))}catch(e){$('mainContent').innerHTML='<div class="error">Notifications could not load: '+esc(e.message)+'</div>';$('status').textContent='Load error'}finally{busy=false}}
async function markRead(id){let {error}=await db.from('notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('id',id).eq('user_id',currentUser.id);if(error)return toast(error.message);loadNotifications()}async function markAllRead(){try{let {error}=await db.from('notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('user_id',currentUser.id).eq('is_read',false);if(error)throw error;let s=getSeen();requestRows.forEach(x=>s.add('request:'+x.id));messageRows.forEach(x=>s.add('message:'+x.id));localStorage.setItem(seenKey(),JSON.stringify([...s]));toast('All notifications marked as read');loadNotifications()}catch(e){toast(e.message)}}async function requestAction(id,status){try{let {data,error}=await db.from('private_requests').update({status}).eq('id',id).eq('receiver_id',currentUser.id).eq('status','pending').select('id');if(error)throw error;if(!data?.length)throw Error('Request already processed or permission denied');toast(status==='accepted'?'Request accepted':'Request declined');loadNotifications()}catch(e){toast(e.message)}}
function openReply(uid,sid){if(!uid||!sid)return toast('Story reply details missing. Please run the SQL setup.');replyRecipient=uid;replyStoryId=sid;$('replyTarget').style.display='block';$('replyTarget').textContent='Replying privately to '+pname(peopleById[uid]);$('replyBox').style.display='block';$('replyText').focus();window.scrollTo({top:0,behavior:'smooth'})}function cancelReply(){replyRecipient=null;replyStoryId=null;$('replyBox').style.display='none';$('replyTarget').style.display='none';$('replyText').value=''}async function sendNotificationReply(){let message=$('replyText').value.trim();if(!message||!replyRecipient||!replyStoryId)return toast('Reply message likhein.');try{let {error}=await db.from('story_replies').insert({story_id:replyStoryId,sender_id:currentUser.id,receiver_id:replyRecipient,message});if(error)throw error;let n=await db.from('notifications').insert({user_id:replyRecipient,sender_id:currentUser.id,type:'story_reply',story_id:replyStoryId,message:'replied to your story: '+message,is_read:false});if(n.error)throw n.error;toast('Reply sent 💜');cancelReply();}catch(e){toast('Reply failed: '+e.message+' — SQL setup check karein.')}}
async function init(){try{try{if(localStorage.getItem('chatzone-theme')==='dark')document.documentElement.dataset.theme='dark'}catch{}let {data,error}=await db.auth.getSession();if(error)throw error;currentUser=data.session?.user||null;if(!currentUser){$('status').textContent='Please log in';$('mainContent').innerHTML='<div class="empty">Please log in.<br><br><button class="btn open" onclick="location.href=\'login.html\'">Go to Login</button></div>';return}await loadNotifications();let params=new URLSearchParams(location.search),uid=params.get('reply_to'),sid=params.get('story_id');if(uid&&sid)openReply(uid,sid);channel=db.channel('chatzone-notifications-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+currentUser.id},loadNotifications).on('postgres_changes',{event:'*',schema:'public',table:'private_messages',filter:'receiver_id=eq.'+currentUser.id},loadNotifications).on('postgres_changes',{event:'*',schema:'public',table:'private_requests',filter:'receiver_id=eq.'+currentUser.id},loadNotifications).subscribe()}catch(e){$('mainContent').innerHTML='<div class="error">Could not connect: '+esc(e.message)+'</div>'}}let timer=setInterval(()=>{if(document.visibilityState==='visible')loadNotifications()},15000);window.addEventListener('beforeunload',()=>{clearInterval(timer);if(channel)db.removeChannel(channel)});init();
</script></body></html>
