
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title> ChatZone 💬 -Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(
        135deg,
        #6c5ce7,
        #8e44ad
      );
    }

    .signup-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:30px 22px;
      border-radius:20px;
      box-shadow:
        0 15px 40px rgba(0,0,0,.18);
    }

    .logo{
      text-align:center;
      font-size:32px;
      font-weight:800;
      color:#6c5ce7;
      margin-bottom:5px;
    }

    .tagline{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }

    h2{
      text-align:center;
      margin:0 0 22px;
      color:#222;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#6c5ce7;
    }

    .hint{
      margin-top:-8px;
      margin-bottom:14px;
      font-size:12px;
      color:#888;
      line-height:1.4;
    }

    /* =========================
       PASSWORD
    ========================= */

    .password-wrap{
      position:relative;
      width:100%;
    }

    .password-wrap input{
      padding-right:55px;
    }

    .show-password{
      position:absolute;
      right:4px;
      top:0;
      width:46px;
      height:45px;
      padding:0;
      margin:0;
      border:0;
      background:transparent;
      color:#666;
      font-size:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:5;
    }

    .show-password:hover,
    .show-password:active,
    .show-password:focus{
      background:transparent;
      outline:none;
    }

    .create-btn{
      width:100%;
      border:0;
      padding:14px;
      border-radius:12px;
      background:#6c5ce7;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .create-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    #message{
      text-align:center;
      margin-top:15px;
      font-size:14px;
      min-height:20px;
      line-height:1.5;
    }

    .login-link{
      text-align:center;
      margin-top:20px;
      color:#666;
      font-size:14px;
    }

    .login-link a{
      color:#6c5ce7;
      font-weight:bold;
      text-decoration:none;
    }

  </style>

</head>

<body>

  <div class="signup-box">

    <div class="logo">
      ChatZone 💬
    </div>

    <div class="tagline">
      Connect. Share. Belong.
    </div>

    <h2>
      Create Account
    </h2>


    <form id="signupForm">

      <!-- NAME -->

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        maxlength="50"
        autocomplete="name"
        required
      >


      <!-- USERNAME -->

      <input
        type="text"
        id="username"
        placeholder="Username"
        maxlength="20"
        autocomplete="username"
        required
      >

      <div class="hint">
        Username 4–20 characters ka ho.
        Sirf letters, numbers aur _ allowed hain.
      </div>


      <!-- PASSWORD -->

      <div class="password-wrap">

        <input
          type="password"
          id="password"
          placeholder="Password"
          minlength="6"
          maxlength="72"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="passwordToggle"
          aria-label="Show password">

          👁️

        </button>

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="password-wrap">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          minlength="6"
          maxlength="72"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="confirmPasswordToggle"
          aria-label="Show confirm password">

          👁️

        </button>

      </div>


      <!-- CREATE ACCOUNT -->

      <button
        type="submit"
        class="create-btn"
        id="signupBtn">

        Create Account

      </button>

    </form>


    <div id="message"></div>


    <div class="login-link">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://jhcpqjmxiovvqbghpxbf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   PASSWORD SHOW / HIDE
======================================== */

function setupPasswordToggle(
  inputId,
  buttonId
){

  const input =
    document.getElementById(inputId);

  const button =
    document.getElementById(buttonId);


  if(!input || !button){
    return;
  }


  button.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();


      if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
          "aria-label",
          "Hide password"
        );

      }else{

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    }
  );

}


/* ========================================
   START PASSWORD BUTTONS
======================================== */

setupPasswordToggle(
  "password",
  "passwordToggle"
);

setupPasswordToggle(
  "confirmPassword",
  "confirmPasswordToggle"
);


/* ========================================
   SIGNUP FORM
======================================== */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      let username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      const button =
        document.getElementById(
          "signupBtn"
        );


      const message =
        document.getElementById(
          "message"
        );


      message.textContent = "";

      message.style.color =
        "#666";


      /* =========================
         NAME
      ========================= */

      if(!name){

        message.style.color =
          "#d63031";

        message.textContent =
          "Name enter karein.";

        return;

      }


      if(name.length < 2){

        message.style.color =
          "#d63031";

        message.textContent =
          "Name kam az kam 2 characters ka hona chahiye.";

        return;

      }


      /* =========================
         USERNAME
      ========================= */

      if(
        username.length < 4 ||
        username.length > 20
      ){

        message.style.color =
          "#d63031";

        message.textContent =
          "Username 4 se 20 characters ka hona chahiye.";

        return;

      }


      const usernamePattern =
        /^[a-z0-9_]+$/;


      if(
        !usernamePattern.test(username)
      ){

        message.style.color =
          "#d63031";

        message.textContent =
          "Username mein sirf letters, numbers aur _ use karein.";

        return;

      }


      /* =========================
         PASSWORD
      ========================= */

      if(password.length < 6){

        message.style.color =
          "#d63031";

        message.textContent =
          "Password kam az kam 6 characters ka hona chahiye.";

        return;

      }


      /* =========================
         CONFIRM PASSWORD
      ========================= */

      if(
        password !== confirmPassword
      ){

        message.style.color =
          "#d63031";

        message.textContent =
          "Passwords match nahi kar rahe.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "Checking...";


      try{


        /* =========================
           CHECK USERNAME
        ========================= */

        const {
          data: existingProfile,
          error: usernameError
        } =
          await supabaseClient
            .from("profiles")
            .select("id")
            .eq(
              "username",
              username
            )
            .maybeSingle();


        if(usernameError){

          throw new Error(
            "Username check failed: " +
            usernameError.message
          );

        }


        if(existingProfile){

          message.style.color =
            "#d63031";

          message.textContent =
            "Ye username already taken hai.";

          button.disabled = false;

          button.textContent =
            "Create Account";

          return;

        }


        /* =========================
           HIDDEN SYSTEM EMAIL
        ========================= */

        const systemEmail =
          username +
          "@rbtahub.local";


        button.textContent =
          "Creating account...";


        /* =========================
           CREATE ACCOUNT
        ========================= */

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email:
              systemEmail,

            password:
              password,

            options:{

              data:{

                name:
                  name,

                username:
                  username

              }

            }

          });


        if(error){

          throw new Error(
            error.message
          );

        }


        /* =========================
           SUCCESS
        ========================= */

        message.style.color =
          "#00a884";


        message.textContent =
          "Account successfully create ho gaya.";


        button.textContent =
          "Account Created";


        /* =========================
           GO LOGIN
        ========================= */

        setTimeout(
          function(){

            window.location.href =
              "login.html";

          },
          1200
        );


      }catch(error){

        console.error(
          "SIGNUP ERROR:",
          error
        );


        message.style.color =
          "#d63031";


        let errorText =
          error?.message ||
          "Account create nahi ho saka.";


        if(
          errorText
            .toLowerCase()
            .includes("rate limit")
        ){

          errorText =
            "Signup temporarily limit ho gaya hai. Thori der baad dobara try karein.";

        }


        message.textContent =
          errorText;


        button.disabled = false;

        button.textContent =
          "Create Account";

      }

    }
  );

</script>

</body>
</html>
```
