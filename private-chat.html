function bubble(r){
 const mine=r.sender_id===me.id,pend=String(r.id).startsWith("local-"),type=r.message_type||"text";let body="";
 if(r.reply_to_content)body+=`<div class="reply-quote"><b>${r.reply_to_sender_id===me.id?"You":safe(other?.name||other?.username||"User")}</b><br>${safe(r.reply_to_content)}</div>`;

}
function sorted(){rows.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
function render(keep=false){const box=$("messages"),old=box.scrollTop,near=box.scrollHeight-box.scrollTop-box.clientHeight<160;const all=rows.slice();for(const[id,r]of pending)if(!all.some(x=>String(x.id)===id))all.push(r);all.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));box.innerHTML=`<button id="loadOlder" type="button" style="display:${hasMore?"block":"none"}">⬆️ Load older messages</button>`+(all.length?all.map(bubble).join(""):'<div class="notice">👋 Say hello and start the conversation.</div>');if(!keep||near)box.scrollTop=box.scrollHeight;else box.scrollTop=old;$("loadOlder").onclick=loadOlder}
function addOrUpdate(r){if(!pairMatch(r)||r.id==null)return;const id=String(r.id),idx=rows.findIndex(x=>String(x.id)===id);if(idx>=0){rows[idx]={...rows[idx],...r};render(true);return}for(const[pid,p]of pending){if(p.sender_id===r.sender_id&&p.receiver_id===r.receiver_id&&txt(p)===txt(r)&&(p.message_type||"text")===(r.message_type||"text")&&(p.media_url||null)===(r.media_url||null)){pending.delete(pid);break}}rows.push(r);sorted();loaded=Math.max(loaded,rows.length);render(true);if(r.receiver_id===me.id&&document.visibilityState==="visible")markSeen()}
function removeRow(id){rows=rows.filter(r=>String(r.id)!==String(id));pending.delete(String(id));render(true)}
function localMessage(payload){const id="local-"+Date.now()+"-"+Math.random().toString(36).slice(2),r={...payload,id,created_at:new Date().toISOString()};pending.set(id,r);render(true);return id}
async function sendPayload(payload){const localId=localMessage(payload);try{const{data,error}=await db.from("private_messages").insert(payload).select("*").single();if(error)throw error;pending.delete(localId);if(data)addOrUpdate(data);else await syncMessages();status("");return true}catch(e){pending.delete(localId);render(true);status("Message not sent: "+(e.message||"Check Supabase permissions."));return false}}
async function syncMessages(initial=false,keep=true){if(!me||!otherId||loading||loadingOlder){refreshQueued=true;return}loading=true;try{const{data,error}=await db.from("private_messages").select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`).order("created_at",{ascending:false}).range(0,PAGE-1);if(error)throw error;const fetched=(data||[]).reverse();for(const r of fetched){for(const[pid,p]of pending)if(p.sender_id===r.sender_id&&p.receiver_id===r.receiver_id&&txt(p)===txt(r)&&(p.message_type||"text")===(r.message_type||"text"))pending.delete(pid)}const map=new Map(rows.map(r=>[String(r.id),r]));fetched.forEach(r=>map.set(String(r.id),{...(map.get(String(r.id))||{}),...r}));rows=[...map.values()].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));loaded=Math.max(loaded,fetched.length);hasMore=(data||[]).length===PAGE;render(keep);status("");if(initial)await markSeen()}catch(e){console.error("Chat sync:",e);status("Messages could not load: "+(e.message||"Check internet/RLS."))}finally{loading=false;if(refreshQueued){refreshQueued=false;setTimeout(()=>syncMessages(false,true),250)}}}
async function loadOlder(){if(loadingOlder||loading||!hasMore)return;loadingOlder=true;$("loadOlder").disabled=true;try{const{data,error}=await db.from("private_messages").select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`).order("created_at",{ascending:false}).range(loaded,loaded+PAGE-1);if(error)throw error;const older=(data||[]).reverse(),known=new Set(rows.map(r=>String(r.id)));rows=[...older.filter(r=>!known.has(String(r.id))),...rows];loaded+=data?.length||0;hasMore=(data||[]).length===PAGE;render(true)}catch(e){status("Older messages load nahi hue: "+e.message)}finally{loadingOlder=false}}
async function markSeen(){if(!me||!otherId||document.visibilityState!=="visible"||Date.now()-lastSeenAt<1200)return;lastSeenAt=Date.now();try{const{error}=await db.from("private_messages").update({seen_at:new Date().toISOString()}).eq("sender_id",otherId).eq("receiver_id",me.id).is("seen_at",null);if(error)throw error}catch(e){console.warn("Seen update:",e)}}

async function refreshProfile(){const{data,error}=await db.from("profiles").select("id,username,name,avatar_url,last_seen").eq("id",otherId).maybeSingle();if(error)throw error;if(!data)throw new Error("User profile not found.");other=data;$("chatName").textContent=data.name||data.username||"ChatZone User";$("chatStatus").textContent=online()?"🟢 Online":(data.username?"@"+data.username:"Private conversation");if(data.avatar_url)$("avatar").outerHTML=`<img id="avatar" src="${safe(data.avatar_url)}" alt="">`}

function startPolling(){stopPolling();pollTimer=setInterval(()=>{if(chatReady&&document.visibilityState==="visible"&&navigator.onLine)syncMessages(false,true)},2500)}
function retryRealtime(){if(retryTimer||!chatReady)return;channelStarting=false;channel=null;const wait=Math.min(20000,1000*Math.pow(2,Math.min(retryCount++,4)));status("Reconnecting live chat…");retryTimer=setTimeout(()=>{retryTimer=null;if(navigator.onLine&&document.visibilityState==="visible")startRealtime()},wait)}
function startRealtime(){if(!chatReady||!me||!otherId||!navigator.onLine||channel||channelStarting)return;channelStarting=true;const ch=db.channel("cz-chat-"+me.id+"-"+otherId+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"private_messages"},payload=>{const r=payload.new||payload.old;if(!pairMatch(r))return;if(payload.eventType==="DELETE")removeRow(r.id);else addOrUpdate(payload.new);if(payload.eventType==="INSERT"&&r.receiver_id===me.id)markDelivered()});channel=ch;ch.subscribe((state,err)=>{if(channel!==ch)return;if(state==="SUBSCRIBED"){channelStarting=false;retryCount=0;status("");if(retryTimer){clearTimeout(retryTimer);retryTimer=null}syncMessages(false,true)}else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(state)){console.warn("Realtime:",state,err);retryRealtime()}})}

$("cancelReply").onclick=cancelReply;$("imageBtn").onclick=()=>$("imageInput").click();$("imageInput").onchange=async e=>{const f=e.target.files?.[0];if(f){if(!f.type.startsWith("image/"))status("Please choose an image file.");else await uploadSend(f,"image")}e.target.value=""};
const emojis=["😀","😂","🥹","😍","😘","😊","😉","😭","😎","🥰","❤️","💜","💖","💕","👍","👎","🙏","👏","🔥","🎉","🤔","😴","😡","😇","🙈","💯","✅","😋","🤗","😔","🤣","😜","🌹","✨","🙌","🤝","💐","😅","😆","😃","😢","😱","🤩","🫶","💗","💞","💔","👀"];
$("emojiPanel").innerHTML=emojis.map(x=>`<button type="button">${x}</button>`).join("");$("emojiPanel").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=$("messageInput"),a=i.selectionStart,z=i.selectionEnd;i.value=i.value.slice(0,a)+b.textContent+i.value.slice(z);i.focus();i.selectionStart=i.selectionEnd=a+b.textContent.length;$("emojiPanel").style.display="none"});$("emojiBtn").onclick=()=>$("emojiPanel").style.display=$("emojiPanel").style.display==="flex"?"none":"flex";
$("voiceBtn").onclick=async()=>{if(recording){mediaRecorder?.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status("Voice recording is not supported in this browser.");return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());recording=false;$("voiceBtn").textContent="🎤";const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});if(blob.size)await uploadSend(new File([blob],`voice-${Date.now()}.webm`,{type:blob.type}),"voice")};mediaRecorder.start();recording=true;$("voiceBtn").textContent="⏹️";status("Recording voice… tap ⏹️ to finish and send.")}catch(e){console.error(e);status("Microphone permission was not granted.")}};
$("messageInput").addEventListener("input",e=>{e.target.style.height="42px";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("sendForm").requestSubmit()}});
async function init(){try{const{data,error}=await db.auth.getSession();if(error)throw error;let session=data?.session;if(!session){await new Promise(r=>setTimeout(r,350));session=(await db.auth.getSession()).data?.session}if(!session?.user){location.href="login.html";return}me=session.user;if(!otherId||otherId===me.id){status("Chat user ID is missing or invalid. Open this chat from a user's 1-on-1 button.");$("chatName").textContent="Chat unavailable";return}await refreshProfile();chatReady=true;await startPresence();await syncMessages(true,false);await markDelivered();startRealtime();startPolling()}catch(e){console.error(e);status("Could not open chat: "+(e.message||"Check Supabase permissions."))}}
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")location.href="login.html";else if(session?.user&&!me)init()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&chatReady&&navigator.onLine){if(!channel)startRealtime();syncMessages(false,true);markDelivered();markSeen()}});addEventListener("online",()=>{if(chatReady){if(!channel)startRealtime();syncMessages(false,true);markDelivered()}});addEventListener("offline",()=>status("Internet disconnected. Messages will sync when connection returns."));addEventListener("pagehide",()=>{stopPolling();if(presence)try{presence.untrack()}catch(e){}});addEventListener("beforeunload",()=>{stopPolling();stopRealtime();stopPresence()});init();
</script></body></html>
