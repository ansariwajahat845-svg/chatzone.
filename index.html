
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatZone 💬</title>
<style>
:root {
 --bg:#171020;
 --card:#241b30;
 --border:#49345a;
 --text:#f5edff;
 --purple:#9655ef;
 --muted:#c8b8d8;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;padding-bottom:110px;
}
button{cursor:pointer;font:inherit}
.header{
 display:flex;align-items:center;gap:8px;
 padding:15px;background:linear-gradient(100deg,#8c4be9,#b17af8);
 position:sticky;top:0;z-index:5;overflow-x:auto;
}
.brand{font-size:20px;font-weight:bold;white-space:nowrap}
.topbtn{
 border:0;border-radius:20px;padding:17px 14px;
 background:#f1e6ff;color:#55327b;font-weight:bold;
 white-space:nowrap;min-width:78px;
}
main{max-width:720px;margin:auto;padding:22px}
.card{
 background:var(--card);border:2px solid var(--border);
 border-radius:28px;padding:22px;margin-bottom:22px;
}
.online-title{font-size:21px;font-weight:bold;margin-bottom:16px}
.online{
 display:inline-flex;align-items:center;gap:9px;
 background:#30233d;padding:10px 15px;border-radius:40px;
 font-size:19px;
}
.avatar{
 width:48px;height:48px;border-radius:50%;
 background:linear-gradient(135deg,#a76aff,#49306c);
 display:grid;place-items:center;font-size:25px;
}
.green{color:#20d17b}
.welcome{text-align:center;font-size:27px;font-weight:bold;padding:25px 8px}
.heading{font-size:23px;font-weight:bold;margin-bottom:20px}
.stories{display:flex;gap:23px;overflow-x:auto}
.story{min-width:115px;text-align:center;font-size:18px}
.story-ring{
 width:110px;height:110px;border-radius:50%;
 border:5px solid #49335e;padding:5px;
 margin:auto auto 10px;
 display:grid;place-items:center;
}
.add{
 border:4px dashed var(--purple);
 color:#d4b4ff;font-size:48px;
}
.face{
 width:100%;height:100%;border-radius:50%;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#49345b,#a66bf3);
 font-size:38px;
}
.create-head{
 display:flex;align-items:center;gap:16px;
 font-size:28px;font-weight:bold;color:#d9baff;
 margin-bottom:25px;
}
.write-icon{
 width:82px;height:82px;border-radius:25px;
 background:linear-gradient(135deg,#a76aff,#7540d8);
 display:grid;place-items:center;font-size:40px;
}
textarea{
 width:100%;height:235px;resize:vertical;
 border:3px solid var(--border);border-radius:38px;
 background:#2c2139;color:white;
 padding:30px;font-size:23px;outline:none;
}
textarea::placeholder{color:#c8b8d8}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{
 background:#30233d;color:white;border:1px solid var(--border);
 padding:14px 18px;border-radius:30px;
}
.postbtn{
 background:linear-gradient(100deg,#a45df4,#7440dc);
 color:white;border:0;padding:15px 30px;
 border-radius:30px;font-weight:bold;
}
.feedpost{
 margin-top:18px;padding:18px;
 background:#30233d;border-radius:20px;
 overflow-wrap:anywhere;
}
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 z-index:10;background:#21182c;
 border-top:2px solid #49345a;
 display:flex;justify-content:space-around;
 padding:8px 4px 12px;
}
.nav{
 flex:1;border:0;background:transparent;
 color:#cdb9e4;border-radius:20px;
 padding:13px 2px;display:flex;
 flex-direction:column;align-items:center;
 gap:5px;font-size:14px;font-weight:bold;
}
.nav span{font-size:22px}
.nav.active{background:#332342;color:#e4caff}
.toast{
 display:none;position:fixed;bottom:110px;
 left:50%;transform:translateX(-50%);
 background:#49305e;color:white;
 padding:12px 20px;border-radius:30px;z-index:20;
}
body.light{background:#f4effb;color:#2b1b3c}
body.light .card{background:white}
body.light .bottom{background:#eee4f8}
@media(max-width:420px){
 main{padding:18px 14px}
 .card{padding:19px}
 .brand{font-size:18px}
 .welcome{font-size:24px}
 .create-head{font-size:24px}
}
</style>
</head>
<body>

<header class="header">
 <div class="brand">ChatZone 💬</div>
 <button class="topbtn" onclick="msg('🔥 Trending')">🔥 Trending</button>
 <button class="topbtn" onclick="sharePage()">📤 Share</button>
 <button class="topbtn" onclick="msg('⭐ Favorites')">⭐</button>
 <button class="topbtn" onclick="msg('🔔 Notifications')">🔔 2</button>
 <button class="topbtn" onclick="theme()">☀️</button>
</header>

<main>

<section class="card">
 <div class="online-title">🟢 1 Users Online</div>
 <div class="online">
  <div class="avatar">🧑🏻</div>
  <span class="green">●</span>
  <span>blackwolf</span>
 </div>
</section>

<section class="card welcome">
 👋 Welcome to ChatZone! 💜💬
</section>

<section class="card">
 <div class="heading">🔴 Stories</div>
 <div class="stories" id="stories">
  <div class="story" onclick="addStory()">
   <div class="story-ring add">＋</div>
   Your story
  </div>
  <div class="story">
   <div class="story-ring"><div class="face">👩🏻</div></div>
   Dream_Girl
  </div>
  <div class="story">
   <div class="story-ring"><div class="face">🧕🏻</div></div>
   A_H
  </div>
 </div>
</section>

<section class="card">
 <div class="create-head">
  <div class="write-icon">✍️</div>
  Create a Post ✨
 </div>

 <textarea id="postText" placeholder="What's on your mind?"></textarea>

 <div class="actions">
  <button class="action" onclick="msg('📷 Photo selected')">📷 Photo</button>
  <button class="action" onclick="msg('😊 Feeling selected')">😊 Feeling</button>
  <button class="postbtn" onclick="createPost()">Post ✨</button>
 </div>

 <div id="feed"></div>
</section>

</main>

<nav class="bottom">
 <button class="nav active" onclick="go(this,'Home')">
  <span>🏠</span>Home
 </button>
 <button class="nav" onclick="go(this,'Private')">
  <span>💌</span>Private
 </button>
 <button class="nav" onclick="go(this,'Mehfil')">
  <span>👥</span>Mehfil
 </button>
 <button class="nav" onclick="go(this,'Profile')">
  <span>👤</span>Profile
 </button>
 <button class="nav" onclick="go(this,'More')">
  <span>⚙️</span>More
 </button>
</nav>

<div class="toast" id="toast"></div>

<script>
function msg(text){
 let t=document.getElementById('toast');
 t.textContent=text;
 t.style.display='block';
 clearTimeout(window.timer);
 window.timer=setTimeout(()=>t.style.display='none',2200);
}

function theme(){
 document.body.classList.toggle('light');
 msg('Theme changed!');
}

function createPost(){
 let input=document.getElementById('postText');
 let value=input.value.trim();

 if(!value){
  msg('Please write something!');
  return;
 }

 let post=document.createElement('div');
 post.className='feedpost';

 let title=document.createElement('b');
 title.textContent='🧑🏻 blackwolf · Just now';

 let content=document.createElement('p');
 content.textContent=value;

 post.append(title,content);
 document.getElementById('feed').prepend(post);
 input.value='';
 msg('Post added successfully!');
}

function addStory(){
 let name=prompt('Enter your story name:');
 if(!name || !name.trim())return;

 let item=document.createElement('div');
 item.className='story';

 let ring=document.createElement('div');
 ring.className='story-ring';

 let face=document.createElement('div');
 face.className='face';
 face.textContent='✨';

 let label=document.createElement('div');
 label.textContent=name;

 ring.append(face);
 item.append(ring,label);
 document.getElementById('stories').append(item);
 msg('Story added!');
}

function go(btn,name){
 document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
 btn.classList.add('active');
 msg(name+' section selected');
}

async function sharePage(){
 if(navigator.share){
  try{
   await navigator.share({
    title:'ChatZone',
    text:'Join me on ChatZone!',
    url:location.href
   });
  }catch(e){}
 }else{
  msg('Share not supported');
 }
}
</script>
</body>
</html>
