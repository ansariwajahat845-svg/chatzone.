<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171020">
<title>ChatZone</title>
<style>
:root{--bg:#171020;--card:#251b32;--card2:#30213e;--border:#493455;--purple:#9457f5;--lav:#d9c4ff;--muted:#c9b9d7;--white:#f8f1ff;--green:#35d17b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;padding-bottom:105px}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
.topbar{height:112px;padding:14px 14px 12px;background:linear-gradient(105deg,#8747ee,#b38aff);display:flex;align-items:center;gap:10px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}.brand{font-size:22px;font-weight:800;margin-right:3px;flex-shrink:0}.pill{height:74px;min-width:83px;padding:0 13px;border:2px solid #e5d5ff;border-radius:23px;background:#f1e6ff;color:#51336d;font-weight:700;box-shadow:0 2px 5px #48206b33;flex-shrink:0}.pill.icon{min-width:83px;font-size:22px}.pill .small{font-size:14px}
main{max-width:760px;margin:auto;padding:22px 23px 24px}.panel{background:var(--card);border:2px solid var(--border);border-radius:29px;padding:22px;margin-bottom:23px;box-shadow:0 5px 18px #09051022}
.online-title{font-size:22px;font-weight:800;margin-bottom:17px}.online-title .green{color:#83d64c}.online-list{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.online-list::-webkit-scrollbar{display:none}.online-user{display:flex;align-items:center;gap:9px;padding:8px 15px 8px 8px;border-radius:40px;background:#332341;white-space:nowrap;font-size:19px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#65507c,#b58bd5);font-size:21px;overflow:hidden}.status{width:15px;height:15px;background:var(--green);border-radius:50%;display:inline-block;margin-left:-2px}
.welcome{text-align:center;font-size:27px;font-weight:800;padding:23px 10px}.section-heading{font-size:23px;font-weight:800;margin:0 0 22px}.stories{display:flex;gap:23px;overflow-x:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 116px;text-align:center;font-size:19px;color:#eee2fa}.story-ring{width:112px;height:112px;border-radius:50%;padding:5px;margin:0 auto 10px;background:linear-gradient(135deg,#9c5cff,#6636a2)}.story-ring.seen{background:#554365}.story-photo{width:100%;height:100%;border-radius:50%;border:5px solid var(--card);background:linear-gradient(135deg,#3b2b4b,#70517f);display:grid;place-items:center;font-size:38px}.story-add{border:3px dashed #a76aff;background:#30213e;color:#d9baff;font-size:54px;font-weight:300}
.create{padding:22px 23px 24px}.create-head{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:800;margin-bottom:26px;color:#d7b9ff}.write-icon{width:82px;height:82px;border-radius:29px;display:grid;place-items:center;background:linear-gradient(135deg,#a65bff,#7245d4);font-size:42px;box-shadow:0 5px 20px #7f48d455;flex-shrink:0}textarea{width:100%;height:240px;resize:vertical;background:#2b2038;border:3px solid #624575;border-radius:38px;padding:34px 32px;color:white;font-size:25px;outline:none}textarea::placeholder{color:#c9b8d5}textarea:focus{border-color:#a76aff}.post-tools{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.tool-btn,.post-btn{padding:15px 18px;border-radius:25px;background:#332440;border:2px solid #493455;font-weight:700;font-size:16px}.post-btn{background:linear-gradient(135deg,#a65bff,#7543d7);border:0;min-width:130px}
.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;height:100px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:stretch;background:#241a30;border-top:2px solid #44304f;box-shadow:0 -6px 20px #0b071188}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:#cdb9df;font-size:14px;font-weight:700;border-radius:18px}.nav-item .emoji{font-size:21px}.nav-item.active{background:#352442;color:#e5caff}
#toast{position:fixed;z-index:10;bottom:115px;left:50%;transform:translateX(-50%);padding:12px 17px;border-radius:14px;background:#4b3561;color:white;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1}input[type=file]{display:none}
@media(max-width:420px){main{padding:17px 14px}.panel{padding:18px;border-radius:25px}.welcome{font-size:24px}.section-heading{font-size:21px}.create-head{font-size:25px}.write-icon{width:70px;height:70px}textarea{height:220px;font-size:22px;padding:27px 24px}.story{flex-basis:105px}.story-ring{width:100px;height:100px}.bottom-nav{height:94px}}
</style>
</head>
<body>
<nav class="topbar">
 <div class="brand">ChatZone 💬</div>
 <button class="pill" onclick="notice('Trending is coming soon')">🔥 <span class="small">Trending</span></button>
 <button class="pill" onclick="notice('Share ChatZone with friends')">📤 <span class="small">Share</span></button>
 <button class="pill icon" onclick="notice('Your favourites')">⭐</button>
 <button class="pill icon" onclick="notice('No new notifications')">🔔</button>
 <button class="pill icon" onclick="toggleTheme()">☀️</button>
</nav>
<main>
 <section class="panel">
  <div class="online-title"><span class="green">🟢</span> <span id="onlineCount">1</span> Users Online</div>
  <div class="online-list">
   <div class="online-user"><div class="avatar">🐺</div><span class="status"></span><span>blackwolf</span></div>
   <div class="online-user"><div class="avatar">🌸</div><span class="status"></span><span>Dream_Girl</span></div>
  </div>
 </section>
 <section class="panel welcome">👋 Welcome to ChatZone! 💜💬</section>
 <section class="panel">
  <h2 class="section-heading">⭕ Stories</h2>
  <div class="stories">
   <div class="story" onclick="document.getElementById('storyUpload').click()"><div class="story-ring"><div class="story-photo story-add">＋</div></div>Your story</div>
   <div class="story" onclick="notice('Dream_Girl story')"><div class="story-ring"><div class="story-photo">👩🏻</div></div>Dream_Girl</div>
   <div class="story" onclick="notice('A_H story')"><div class="story-ring"><div class="story-photo">👩🏻‍🦰</div></div>A_H</div>
  </div>
  <input id="storyUpload" type="file" accept="image/*" onchange="picked(this,'Story image selected')">
 </section>
 <section class="panel create">
  <div class="create-head"><div class="write-icon">✍️</div><span>Create a Post ✨</span></div>
  <textarea id="postText" placeholder="What's on your mind?"></textarea>
  <div class="post-tools">
   <label class="tool-btn" for="postImage">🖼️ Photo</label><input id="postImage" type="file" accept="image/*" onchange="picked(this,'Post image selected')">
   <button class="tool-btn" onclick="notice('Voice recording feature can be connected')">🎙️ Voice</button>
   <button class="post-btn" onclick="publishPost()">Post ✨</button>
  </div>
 </section>
</main>
<nav class="bottom-nav">
 <button class="nav-item active" onclick="nav('Home')"><span class="emoji">🏠</span>Home</button>
 <button class="nav-item" onclick="nav('Private')"><span class="emoji">💌</span>Private</button>
 <button class="nav-item" onclick="nav('Mehfil')"><span class="emoji">👥</span>Mehfil</button>
 <button class="nav-item" onclick="nav('Profile')"><span class="emoji">👤</span>Profile</button>
 <button class="nav-item" onclick="nav('More')"><span class="emoji">⚙️</span>More</button>
</nav>
<div id="toast"></div>
<script>
let timer;
function notice(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2300)}
function nav(name){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.textContent.includes(name)));if(name!=='Home')notice(name+' page selected')}
function picked(input,msg){if(input.files&&input.files[0])notice(msg+': '+input.files[0].name)}
function publishPost(){let v=document.getElementById('postText').value.trim();if(!v){notice('Please write something first');return}notice('Post created (demo)');document.getElementById('postText').value=''}
function toggleTheme(){notice('You are using ChatZone dark mode')}
</script>
</body>
</html>
