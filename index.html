<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7650d2">
<title>ChatZone 💬 — Home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#7650d2;--panel:#fff;--panel2:#f1ebff;--line:#e9e5ef;
  --text:#17131d;--muted:#77727e;--purple:#7950d6;--purple2:#7950d6;
  --green:#239b68;--shadow:0 8px 24px #2d15502b;
}
*{box-sizing:border-box}
html{width:100%;min-height:100%;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;width:100%;min-height:100vh;min-height:100dvh;overflow-x:hidden;
  color:var(--text);background:linear-gradient(180deg,#6f4bd0 0%,#8c4ac7 100%);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(94px + env(safe-area-inset-bottom));
}
body.light{--bg:#f6f1fc;--panel:#fff;--panel2:#f1e9fb;--line:#ded0ed;--text:#241632;--muted:#756681;--shadow:0 8px 22px #3d245018}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.topbar{
  position:sticky;top:0;z-index:20;width:100%;min-height:66px;padding:9px 14px;
  display:flex;align-items:center;gap:8px;background:linear-gradient(110deg,#6545c8,#9251d5);
  box-shadow:0 4px 18px #0003;overflow-x:auto;scrollbar-width:none
}
.topbar::-webkit-scrollbar{display:none}
.brand{font-size:18px;font-weight:850;white-space:nowrap;margin-right:auto;flex:0 0 auto;color:#fff}
.top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.top-btn{position:relative;flex:0 0 auto;height:42px;min-width:42px;padding:0 10px;border:1px solid #ffffff75;
  border-radius:14px;background:#ffffffdf;color:#503276;font-weight:750;box-shadow:0 2px 5px #44206b25}
.top-btn.wide{font-size:12px}
.top-btn .count{position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;padding:0 4px;
  display:grid;place-items:center;border-radius:20px;background:#e64e54;color:#fff;font-size:11px}
.wrap{width:100%;max-width:none;margin:0 auto;padding:22px clamp(14px,3vw,36px) 34px}
.panel{width:100%;min-width:0;margin:0 0 22px;padding:24px;border:0;border-radius:24px;
  background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.online-title,.section-title,.feed-title{font-size:20px;color:var(--text);font-weight:850;margin:0 0 12px}
.online-list{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:1px 1px 4px;scrollbar-width:none}
.online-list::-webkit-scrollbar,.stories::-webkit-scrollbar{display:none}
.online-user{display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;padding:7px 10px;
  border-radius:30px;background:var(--panel2);font-size:14px}
.avatar{width:42px;height:42px;flex:0 0 auto;display:inline-grid;place-items:center;object-fit:cover;
  border-radius:50%;background:#47345d;color:#fff;border:3px solid #eee6fb}
.dot{width:9px;height:9px;flex:0 0 auto;display:inline-block;border-radius:50%;background:var(--green)}
.welcome{min-height:76px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:15px 10px;font-size:21px;font-weight:850;line-height:1.35}
.stories{display:flex;gap:15px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 7px;scrollbar-width:none;align-items:flex-start}
.story{width:82px;flex:0 0 82px;min-width:0;text-align:center;cursor:pointer}
.story-ring{width:72px;height:72px;margin:0 auto 7px;padding:3px;display:grid;place-items:center;overflow:hidden;
  border-radius:50%;background:linear-gradient(135deg,#a76cff,#6e42bd)}
.story-ring img,.story-ring .avatar{display:block;width:100%;height:100%;min-width:0;min-height:0;
  border:3px solid var(--panel);border-radius:50%;object-fit:cover}
.story-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-story .story-ring{border:3px dashed #a66cff;background:var(--panel2);color:#8b5bd9;font-size:35px;font-weight:300}
.composer{padding:19px}
.composer-head{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.compose-icon{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;border-radius:16px;
  background:linear-gradient(135deg,#a45dff,#8050d9);font-size:26px;box-shadow:0 5px 14px #8c4ce744}
.composer h2{margin:0;color:#7650cf;font-size:21px;line-height:1.3}
textarea{display:block;width:100%;min-height:120px;resize:vertical;border:1.5px solid var(--line);
  border-radius:20px;background:#faf8fd;color:var(--text);padding:16px;font-size:16px;line-height:1.5;outline:none}
textarea:focus,input:focus{border-color:var(--purple)}
.composer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.action-btn{min-height:41px;padding:9px 12px;border:1px solid var(--line);border-radius:15px;
  background:var(--panel2);color:#38264e;font-size:13px;font-weight:750}
.action-btn.primary{flex:1 1 120px;border:0;background:linear-gradient(135deg,#9b5df5,#7543d2);color:#fff}
.action-btn:disabled{opacity:.65;cursor:wait}
.file-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.post-time{font-size:11px;color:var(--muted)}
.feed-title{margin:20px 5px 12px;color:#fff}
#feed{display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
#feed .post{width:100%;max-width:100%;min-width:0}
.post{padding:22px;margin:0 0 16px}
.post-head{display:flex;align-items:center;gap:10px;min-width:0}
.post-head .avatar{width:43px;height:43px}
.post-head>div{min-width:0}
.post-name{font-size:15px;font-weight:850;overflow-wrap:anywhere}
.post-text{margin:14px 0;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.post-image{display:block;width:100%;max-width:100%;max-height:520px;object-fit:contain;border-radius:15px}
.post-actions{display:flex;flex-wrap:wrap;gap:7px;padding-top:11px;border-top:1px solid var(--line)}
.post-actions button{min-height:39px;padding:8px 11px;border:0;border-radius:15px;background:var(--panel2);color:#38264e;font-size:13px;white-space:nowrap}
.comment-area{display:none;margin-top:12px}
.comment-area.open{display:block}
.comment-area input{width:100%;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:15px;
  background:#faf8fd;color:var(--text);outline:none}
.empty{text-align:center;color:var(--muted);padding:18px}
.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:2px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#fff;
  border:0;border-radius:18px 18px 0 0;box-shadow:0 -7px 24px #2d15502b}
.nav-item{min-width:0;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:12px;text-decoration:none;color:#77727e;font-size:12px;font-weight:650}
.nav-item span:first-child{font-size:25px;line-height:1.15}
.nav-item.active{background:transparent;color:#7650cf}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:none;max-width:92%;padding:11px 16px;border-radius:18px;background:#30223d;color:#fff;text-align:center;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:#000d}
.modal.show{display:flex}
.modal-card{position:relative;width:min(100%,520px);max-height:90dvh;overflow:auto;padding:18px;border:1px solid var(--line);
  border-radius:22px;background:#fff;color:#17131d}
.modal-card img,.modal-card video{display:block;width:100%;max-width:100%;max-height:75dvh;object-fit:contain;border-radius:14px}
.modal-close{position:absolute;right:12px;top:12px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;
  background:#eee8f7;color:#38264e;font-size:23px}
#storyContent h3{margin:0 48px 14px 0}
.story-progress{height:4px;background:#ddd;border-radius:9px;overflow:hidden;margin-bottom:13px}
.story-progress span{display:block;width:100%;height:100%;background:#8c59e8}
@media(min-width:700px){.wrap{padding:28px clamp(24px,3vw,48px) 40px}.panel{padding:28px}.post{padding:26px}}
@media(max-width:380px){
  .brand{font-size:15px}.topbar{padding-left:8px;padding-right:8px;gap:5px}
  .top-actions{gap:4px}.top-btn{min-width:38px;padding:0 7px}.top-btn.wide{font-size:10px;padding:0 7px}
  .wrap{padding:16px 12px 28px}.panel{padding:19px;border-radius:21px}
  .post-actions{gap:5px}.post-actions button{padding:8px;font-size:12px}
  .story{width:74px;flex-basis:74px}.nav-item{font-size:10px}.nav-item span:first-child{font-size:22px}
}
@media(max-width:480px){
  #storyModal{padding:0}
  #storyModal .modal-card{width:100%;max-width:none;min-height:100dvh;max-height:100dvh;
    border-radius:0;padding:22px 16px;display:flex;flex-direction:column;justify-content:center}
  #storyContent video,#storyContent img{max-height:78dvh}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">ChatZone 💬</div>
  <div class="top-actions">
    <button class="top-btn wide" onclick="showToast('Trending posts coming soon')">🔥 Trending</button>
    <button class="top-btn wide" onclick="sharePage()">📤 Share</button>
    <button class="top-btn" title="Stars" onclick="showToast('ChatZone Stars ⭐')">⭐</button>
    <button class="top-btn" title="Notifications" onclick="location.href='notifications.html'">🔔<span class="count" id="noticeCount" hidden>0</span></button>
    <button class="top-btn" title="Theme" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="online-title">🟢 <span id="onlineCount">0</span> Users Online</div>
    <div class="online-list" id="onlineList"><div class="empty">Loading online users...</div></div>
  </section>

  <section class="panel welcome">👋 Welcome to ChatZone! 💜💬</section>

  <section class="panel">
    <h2 class="section-title">🔴 Stories</h2>
    <div class="stories" id="storiesList">
      <div class="story add-story" onclick="document.getElementById('storyFile').click()">
        <div class="story-ring">+</div><div class="story-name">Your story</div>
      </div>
    </div>
    <input type="file" id="storyFile" accept="image/*,video/mp4,video/webm,video/quicktime" hidden onchange="uploadStory(this.files[0])">
    <p class="post-time" style="margin:7px 2px 0">Add a photo or video story (up to 50 MB).</p>
  </section>

  <section class="panel composer">
    <div class="composer-head"><div class="compose-icon">✍️</div><h2>Create a Post ✨</h2></div>
    <textarea id="postText" placeholder="What's on your mind?"></textarea>
    <div class="composer-actions">
      <label class="action-btn file-label">🖼️ Image <input id="postImage" type="file" accept="image/*" hidden></label>
      <label class="action-btn file-label">🎙️ Voice <input id="postVoice" type="file" accept="audio/*" hidden></label>
      <button class="action-btn primary" id="sendPostBtn" onclick="createPost()">Send Post ➤</button>
    </div>
    <div id="selectedFile" class="post-time" style="margin-top:10px"></div>
  </section>

  <h2 class="feed-title">✨ Recent Posts</h2>
  <div id="feed"><section class="panel empty">Loading posts...</section></div>
</main>

<nav class="bottom-nav">
  <a class="nav-item active" href="index.html"><span>🏠</span>Home</a>
  <a class="nav-item" href="private.html"><span>💌</span>Private</a>
  <a class="nav-item" href="mehfil.html"><span>👥</span>Mehfil</a>
  <a class="nav-item" href="profile.html"><span>👤</span>Profile</a>
  <a class="nav-item" href="more.html"><span>⚙️</span>More</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="storyModal" onclick="if(event.target===this)closeStory()">
  <div class="modal-card">
    <button class="modal-close" aria-label="Close story" onclick="closeStory()">×</button>
    <div id="storyContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
let currentUser=null,currentProfile=null,postImageFile=null,postVoiceFile=null;
const $=id=>document.getElementById(id);

function showToast(message){
  const t=$('toast');t.textContent=message;t.style.display='block';
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2800);
}
function safe(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function avatarUrl(profile){return profile?.avatar_url||profile?.avatar||profile?.photo_url||profile?.profile_image||''}
function displayName(profile){return profile?.username||profile?.full_name||profile?.name||'ChatZone User'}
function toggleTheme(){
  document.body.classList.toggle('light');
  const light=document.body.classList.contains('light');
  localStorage.setItem('chatzone-home-theme-v2',light?'light':'dark');
  $('themeBtn').textContent=light?'🌙':'☀️';
}
if(localStorage.getItem('chatzone-home-theme-v2')==='light'){
  document.body.classList.add('light');$('themeBtn').textContent='🌙';
}
async function sharePage(){
  try{
    if(navigator.share)await navigator.share({title:'ChatZone',url:location.href});
    else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast('Link copied!')}
    else showToast('Sharing is not supported on this browser.');
  }catch(e){}
}
function initials(name){return safe((name||'U').trim().slice(0,1).toUpperCase())}
function avatar(profile,cls='avatar'){
  const url=avatarUrl(profile);
  return url?`<img class="${cls}" src="${safe(url)}" alt="" onerror="this.style.display='none'">`
    :`<div class="${cls}" style="display:grid;place-items:center">${initials(displayName(profile))}</div>`;
}
function mediaIsVideo(url){
  try{return /\.(mp4|webm|mov|m4v|ogg)$/i.test(new URL(url,location.href).pathname)}
  catch(e){return /\.(mp4|webm|mov|m4v|ogg)(\?|$)/i.test(url||'')}
}

async function init(){
  try{
    const {data:{session},error}=await db.auth.getSession();
    if(error)console.warn(error);
    if(!session){location.replace('login.html');return}
    currentUser=session.user;
    const {data:profile}=await db.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
    currentProfile=profile||{id:currentUser.id,username:currentUser.email?.split('@')[0]||'User'};
    await Promise.allSettled([loadOnline(),loadStories(),loadPosts(),loadNotifications()]);
    db.channel('home-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>loadPosts())
      .on('postgres_changes',{event:'*',schema:'public',table:'stories'},()=>loadStories())
      .subscribe();
  }catch(e){
    console.error('Home initialization failed:',e);
    showToast('Home load nahi ho saka. Internet ya Supabase check karein.');
  }
}
async function loadOnline(){
  const {data,error}=await db.from('profiles').select('*').limit(40);
  if(error){$('onlineList').innerHTML='<div class="empty">Online users are unavailable right now.</div>';return}
  const users=(data||[]).filter(p=>p.id!==currentUser.id&&(p.is_online===true||p.online===true||p.status==='online'));
  $('onlineCount').textContent=users.length+(currentProfile?1:0);
  const all=[currentProfile,...users].filter(Boolean);
  $('onlineList').innerHTML=all.length?all.map(p=>`<div class="online-user">${avatar(p)}<span class="dot"></span>${safe(displayName(p))}</div>`).join('')
    :'<div class="empty">No users online</div>';
}
async function loadStories(){
  const {data,error}=await db.from('stories').select('*').order('created_at',{ascending:false}).limit(30);
  if(error){console.warn('Stories:',error.message);return}
  const ids=[...new Set((data||[]).map(s=>s.user_id||s.owner_id).filter(Boolean))];
  const profiles={};
  if(ids.length){
    const r=await db.from('profiles').select('*').in('id',ids);
    (r.data||[]).forEach(p=>profiles[p.id]=p);
  }
  const own=(data||[]).filter(s=>(s.user_id||s.owner_id)===currentUser.id);
  const other=(data||[]).filter(s=>(s.user_id||s.owner_id)!==currentUser.id);
  const add=`<div class="story add-story" onclick="document.getElementById('storyFile').click()"><div class="story-ring">+</div><div class="story-name">Your story</div></div>`;
  $('storiesList').innerHTML=add+other.map(s=>{
    const p=profiles[s.user_id||s.owner_id]||{};
    const media=s.media_url||s.image_url||s.video_url||s.url||'';
    const thumb=mediaIsVideo(media)?'🎥':avatar(p,'avatar');
    return `<div class="story" onclick="openStory('${safe(s.id)}','${safe(media)}','${safe(displayName(p))}')"><div class="story-ring">${thumb}</div><div class="story-name">${safe(displayName(p))}</div></div>`;
  }).join('')+(own.length?own.map(s=>{
    const media=s.media_url||s.image_url||s.video_url||s.url||'';
    const thumb=mediaIsVideo(media)?'🎥':avatar(currentProfile,'avatar');
    return `<div class="story" onclick="openStory('${safe(s.id)}','${safe(media)}','Your story')"><div class="story-ring">${thumb}</div><div class="story-name">Your story</div></div>`;
  }).join(''):'');
}
function openStory(id,url,name){
  const isVideo=mediaIsVideo(url);
  $('storyContent').innerHTML=`<div class="story-progress"><span></span></div>
    <h3>${safe(name)}</h3>
    ${url?(isVideo
      ?`<video src="${safe(url)}" controls autoplay playsinline preload="metadata"></video>`
      :`<img src="${safe(url)}" alt="Story">`)
      :'<p>Story media unavailable.</p>'}`;
  $('storyModal').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeStory(){
  const video=$('storyContent').querySelector('video');
  if(video){video.pause();video.removeAttribute('src');video.load()}
  $('storyModal').classList.remove('show');$('storyContent').innerHTML='';
  document.body.style.overflow='';
}
async function uploadStory(file){
  if(!file)return;
  const isImage=file.type.startsWith('image/');
  const isVideo=file.type.startsWith('video/');
  if(!isImage&&!isVideo){showToast('Please select an image or video file.');$('storyFile').value='';return}
  if(isVideo&&!['video/mp4','video/webm','video/quicktime'].includes(file.type)){
    showToast('Choose an MP4, WebM or MOV video.');$('storyFile').value='';return;
  }
  const maxBytes=50*1024*1024;
  if(file.size>maxBytes){showToast('File is too large. Maximum size is 50 MB.');$('storyFile').value='';return}
  try{
    showToast('Uploading your story...');
    const originalExt=file.name.split('.').pop()|| (isVideo?'mp4':'jpg');
    const ext=originalExt.toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${currentUser.id}/${Date.now()}.${ext}`;
    const up=await db.storage.from('stories').upload(path,file,{upsert:false,contentType:file.type});
    if(up.error)throw up.error;
    const {data:{publicUrl}}=db.storage.from('stories').getPublicUrl(path);
    const ins=await db.from('stories').insert({
      user_id:currentUser.id,
      media_url:publicUrl,
      created_at:new Date().toISOString()
    });
    if(ins.error)throw ins.error;
    showToast(isVideo?'Video story uploaded! 🎥':'Photo story uploaded! 📸');
    await loadStories();
  }catch(e){
    console.error('Story upload failed:',e);
    showToast('Story upload failed: '+(e.message||'Check stories bucket/table permissions'));
  }finally{$('storyFile').value=''}
}
$('postImage').addEventListener('change',e=>{postImageFile=e.target.files[0]||null;updateFiles()});
$('postVoice').addEventListener('change',e=>{postVoiceFile=e.target.files[0]||null;updateFiles()});
function updateFiles(){
  $('selectedFile').textContent=[postImageFile?.name,postVoiceFile?.name].filter(Boolean).join(' · ');
}
async function createPost(){
  const content=$('postText').value.trim();
  if(!content&&!postImageFile&&!postVoiceFile){showToast('Write something or select a file first');return}
  const btn=$('sendPostBtn');btn.disabled=true;btn.textContent='Posting...';
  try{
    let image_url=null,voice_url=null;
    if(postImageFile){
      const path=`${currentUser.id}/${Date.now()}_${postImageFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const up=await db.storage.from('post-images').upload(path,postImageFile);
      if(up.error)throw up.error;
      image_url=db.storage.from('post-images').getPublicUrl(path).data.publicUrl;
    }
    if(postVoiceFile){
      const path=`${currentUser.id}/${Date.now()}_${postVoiceFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const up=await db.storage.from('voice-posts').upload(path,postVoiceFile);
      if(up.error)throw up.error;
      voice_url=db.storage.from('voice-posts').getPublicUrl(path).data.publicUrl;
    }
    const row={user_id:currentUser.id,content,created_at:new Date().toISOString()};
    if(image_url)row.image_url=image_url;
    if(voice_url)row.voice_url=voice_url;
    const result=await db.from('posts').insert(row);
    if(result.error)throw result.error;
    $('postText').value='';$('postImage').value='';$('postVoice').value='';
    postImageFile=null;postVoiceFile=null;updateFiles();
    showToast('Post shared successfully!');await loadPosts();
  }catch(e){console.error(e);showToast('Could not post: '+(e.message||'Check posts table/storage permissions'))}
  finally{btn.disabled=false;btn.textContent='Send Post ➤'}
}
async function loadPosts(){
  const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false}).limit(40);
  if(error){
    $('feed').innerHTML='<section class="panel empty">Posts could not be loaded. Check the posts table permissions.</section>';
    console.warn(error);return;
  }
  const posts=data||[];
  if(!posts.length){$('feed').innerHTML='<section class="panel empty">No posts yet. Be the first to share something! 💜</section>';return}
  const ids=[...new Set(posts.map(p=>p.user_id).filter(Boolean))],profiles={};
  if(ids.length){
    const r=await db.from('profiles').select('*').in('id',ids);
    (r.data||[]).forEach(p=>profiles[p.id]=p);
  }
  $('feed').innerHTML=posts.map(p=>{
    const profile=profiles[p.user_id]||{},name=displayName(profile);
    const date=p.created_at?new Date(p.created_at).toLocaleString():'';
    const content=p.content||p.body||p.text||'',img=p.image_url||p.image||p.media_url||'',voice=p.voice_url||p.audio_url||'';
    return `<article class="panel post" id="post-${safe(p.id)}">
      <div class="post-head">${avatar(profile)}<div><div class="post-name">${safe(name)}</div><div class="post-time">${safe(date)}</div></div></div>
      <div class="post-text">${safe(content)}</div>
      ${img?`<img class="post-image" src="${safe(img)}" alt="Post image" loading="lazy">`:''}
      ${voice?`<audio controls src="${safe(voice)}" style="display:block;width:100%;max-width:100%;margin:8px 0"></audio>`:''}
      <div class="post-actions">
        <button onclick="reactPost('${safe(p.id)}','like')">❤️ Like</button>
        <button onclick="reactPost('${safe(p.id)}','dislike')">👎 Dislike</button>
        <button onclick="toggleComment('${safe(p.id)}')">💬 Comment</button>
        <button onclick="sharePost('${safe(p.id)}')">📤 Share</button>
      </div>
      <div class="comment-area" id="comments-${safe(p.id)}">
        <input id="comment-input-${safe(p.id)}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')sendComment('${safe(p.id)}')">
        <button class="action-btn" style="margin-top:8px" onclick="sendComment('${safe(p.id)}')">Send</button>
        <div id="comment-list-${safe(p.id)}"></div>
      </div>
    </article>`;
  }).join('');
}
async function reactPost(postId,action){
  try{
    const {error}=await db.from('post_actions').upsert({post_id:postId,user_id:currentUser.id,action},{onConflict:'post_id,user_id'});
    if(error)throw error;
    showToast(action==='like'?'Liked ❤️':'Reaction saved');
  }catch(e){console.warn(e);showToast('Reaction could not be saved')}
}
async function toggleComment(id){
  const box=$('comments-'+id);box.classList.toggle('open');
  if(box.classList.contains('open'))loadComments(id);
}
async function loadComments(id){
  const target=$('comment-list-'+id);
  const {data,error}=await db.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true}).limit(30);
  if(error){target.innerHTML='<div class="post-time">Comments unavailable.</div>';return}
  target.innerHTML=(data||[]).map(c=>`<div class="post-time" style="padding:8px 2px"><b>${safe(c.username||c.name||'User')}:</b> ${safe(c.content||c.comment||c.text||'')}</div>`).join('');
}
async function sendComment(id){
  const input=$('comment-input-'+id),content=input.value.trim();if(!content)return;
  try{
    const {error}=await db.from('comments').insert({post_id:id,user_id:currentUser.id,content,created_at:new Date().toISOString()});
    if(error)throw error;
    input.value='';await loadComments(id);showToast('Comment added');
  }catch(e){console.warn(e);showToast('Comment could not be sent')}
}
async function sharePost(id){
  const url=location.origin+location.pathname+'#post-'+id;
  try{
    if(navigator.share)await navigator.share({title:'ChatZone post',url});
    else if(navigator.clipboard){await navigator.clipboard.writeText(url);showToast('Post link copied')}
    else showToast('Sharing is not supported on this browser.');
  }catch(e){}
}
async function loadNotifications(){
  const {count,error}=await db.from('notifications').select('*',{count:'exact',head:true})
    .eq('user_id',currentUser.id).eq('is_read',false);
  if(!error&&count>0){$('noticeCount').hidden=false;$('noticeCount').textContent=count>9?'9+':count}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStory()});
init();
</script>
</body>
</html>
