<title>ChatZone - Home</title>
<style>
body{background:#120826;color:#fff;font-family:sans-serif;margin:0}
.app{max-width:430px;margin:auto;padding:10px}
.top{background:#b48cf5;padding:12px;border-radius:0 0 16px 16px;display:flex;gap:6px;flex-wrap:wrap;color:#1a0b2e}
.pill{background:#fff;padding:6px 10px;border-radius:20px;font-size:13px;color:#1a0b2e}
.pill i{background:red;color:#fff;border-radius:50%;padding:0 5px;font-style:normal}
.card{background:#2a1545;border:1px solid #4a2a7a;border-radius:20px;padding:14px;margin:12px 0}
.center{text-align:center}
.stories{display:flex;gap:20px;text-align:center}
.ring{width:70px;height:70px;border:3px dashed #a06bff;border-radius:50%;display:grid;place-items:center;font-size:28px}
.g2{border-style:solid;border-color:#a06bff #ff7ab8}.g3{border-style:solid;border-color:#c86bff #ff9a5a}
textarea{width:100%;height:90px;background:#1a0b2e;color:#fff;border:1px solid #4a2a7a;border-radius:14px;padding:10px;box-sizing:border-box}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:10px;border-radius:12px;background:#3a2060;color:#fff;border:0}
.primary{background:#8b5cf6!important}
nav{position:sticky;bottom:0;background:#2a1545;display:flex;justify-content:space-around;padding:12px;border-radius:16px}
.active{color:#b48cf5}
.feed-card img{width:100%;border-radius:14px}
.feed-actions{display:flex;gap:8px}.feed-actions button{flex:1;padding:10px;border-radius:12px;background:#3a2060;color:#fff;border:0}
</style></head>
<body><div class="app">
<header class="top"><b>ChatZone 💬</b><span class="pill">🔥 Trending</span><span class="pill">📤 Share</span><span class="pill">⭐</span><span class="pill">🔔<i>2</i></span><span class="pill">☀️</span></header>
<div class="card"><b>🟢 1 Users Online</b><div style="margin-top:8px;background:#1a0b2e;padding:8px 12px;border-radius:20px;display:inline-block">🟢 blackwolf</div></div>
<div class="card center">👋 Welcome to ChatZone! 💜 💬</div>
<div class="card"><b>🔴 Stories</b><div class="stories"><div><div class="ring"><span>+</span></div><p>Your story</p></div><div><div class="ring g2"><span>👧</span></div><p>Dream_Girl</p></div><div><div class="ring g3"><span>👩</span></div><p>A_H</p></div></div></div>
<div class="card"><h3>✏️ Create a Post ✨</h3><textarea id="postText" placeholder="What's on your mind?"></textarea><div class="row"><button>🎤 Voice</button><button>🖼️ Image Post</button><button class="primary" onclick="addPost()">🚀 Send Post</button></div><p id="status" style="font-size:12px;opacity:.8"></p></div>
<div id="feed"></div>
<nav><span class="active">🏠 Home</span><span>✉️ Private</span><span>👥 Mehfil</span><span>👤 Profile</span><span>⚙️ More</span></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY = "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
document.getElementById("status").innerText = "Supabase Connected ✅";
let posts = [
 {name:"Raj_Kumar", time:"2h", text:"Beautiful day at the mountains today! The view was absolutely stunning 🏔️✨ #nature #peace #mountains", img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800", likes:124, comments:"18 comments • 5 shares"},
 {name:"Sara.Art", time:"5h", text:"Just finished my new sketch! Trying out some watercolor techniques 🎨 Loving the process. What do you think? #art #sketch #creativity", img:"https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800", likes:89, comments:"23 comments • 12 shares"},
];
async function loadFromSupabase(){
  try{
    const {data, error} = await client.from("posts").select("*").order("created_at",{ascending:false}).limit(20);
    if(!error && data && data.length>0){
      posts = data.map(d=>({name:"You", time:"Just now", text:d.content||"", img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800", likes:0, comments:"0 comments"}));
    }
  }catch(e){}
  render();
}
function render(){
  document.getElementById("feed").innerHTML = posts.map(p=>`<div class="card feed-card"><b>${p.name}</b> • ${p.time}<p>${p.text}</p><img src="${p.img}"><p>❤️ ${p.likes} • ${p.comments}</p><div class="feed-actions"><button>👍 Like</button><button>💬 Comment</button><button>↗️ Share</button></div></div>`).join("");
}
async function addPost(){
  const t=document.getElementById("postText").value.trim();
  if(!t) return alert("Pehle kuch likho!");
  document.getElementById("status").innerText = "Posting...";
  const {error} = await client.from("posts").insert([{content:t}]);
  if(error){ document.getElementById("status").innerText = "Supabase me posts table banao, tab save hoga: "+error.message; }
  else { document.getElementById("status").innerText = "Post save ho gaya ✅"; }
  posts.unshift({name:"You", time:"Just now", text:t, img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800", likes:0, comments:"0 comments"});
  document.getElementById("postText").value=""; render();
}
loadFromSupabase();
