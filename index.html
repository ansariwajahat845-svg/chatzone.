<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatZone - Fixed</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5}
.app{max-width:500px;margin:0 auto;min-height:100vh;background:#f0f2f5;padding-bottom:82px}
.header{background:#fff;padding:12px;position:sticky;top:0;z-index:20;border-bottom:1px solid #dddfe2}
.logo{font-size:28px;font-weight:800;color:#1877f2}
.online-section,.welcome,.create-box,.post,.stories-section{background:#fff;margin:12px;padding:12px;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
textarea{width:100%;background:#f0f2f5;border:0;border-radius:20px;padding:12px;font:15px Arial;outline:none;min-height:60px}
button{cursor:pointer}
.create-actions{display:flex;gap:8px;margin-top:10px}
.create-actions button{flex:1;border:0;border-radius:8px;padding:10px;background:#1877f2;color:#fff;font-weight:700}
.feed-header{padding:8px 16px}
.post{margin:14px 12px;padding:12px}
.post-head{display:flex;gap:10px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e4e6eb}
.post-content{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post-image{width:100%;max-height:450px;object-fit:cover;border-radius:14px}
.post-actions{display:flex;gap:6px;margin-top:10px}
.post-actions button{flex:1;border:1px solid #eef2f7;background:#f8f9fb;border-radius:12px;padding:9px;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:60px;background:#fff;border-top:1px solid #dddfe2;display:flex;justify-content:space-around;z-index:30}
.bottom-nav button{border:0;background:none;flex:1;color:#65676b;font-size:11px}
.bottom-nav button.active{color:#1877f2}
.popup{display:none;position:fixed;inset:0;background:#0008;z-index:100;padding:12vh 4% 20px}
.popup-content{max-width:500px;margin:auto;background:#fff;border-radius:12px;padding:15px;max-height:76vh;overflow:auto}
.empty,.loading{text-align:center;padding:25px 10px;color:#65676b}
#jsError{display:none;background:#ffe1e1;color:#a00;padding:12px;margin:12px;border-radius:10px;font-size:13px;white-space:pre-wrap}
.stories-rail{display:flex;gap:12px;overflow-x:auto}
.story-tile{min-width:66px;text-align:center;border:0;background:none;cursor:pointer}
.story-ring{width:62px;height:62px;border-radius:50%;border:2px solid #1877f2;display:grid;place-items:center;overflow:hidden;margin:auto}
.story-ring img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
<header class="header"><div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">ChatZone</div><div><button onclick="showShare()">📤 Share</button> <button onclick="goNotifications()">🔔</button></div></div></header>
<div id="jsError"></div>
<div id="homeView">
<section class="online-section"><div><b>🟢 <span id="onlineCount">0</span> Users Online</b></div><div id="onlineUsers">Connecting to online users…</div></section>
<div class="welcome"><div><div style="font-weight:700;font-size:16px">Welcome to ChatZone</div><div style="font-size:13px;color:#65676b">Connect, chat, and share with friends.</div></div></div>
<section class="stories-section"><h3>Stories</h3><div id="storiesRail" class="stories-rail"><div class="loading">Loading stories…</div></div></section>
<section class="create-box"><div><b>✍️ Create a Post ✨</b></div><textarea id="postText" placeholder="What's on your mind?"></textarea><div class="create-actions"><button onclick="startVoice()">🎙️ Voice</button><button onclick="showImagePost()">📷 Image</button><button onclick="createPost()">🚀 Post</button></div></section>
<div class="feed-header"><h3>Home Feed</h3></div><div id="feed"><div class="loading">Checking login and loading feed…</div></div>
</div>
<div id="shareBox" class="popup"><div class="popup-content"><h3>📤 Create Post</h3><button onclick="showTextPost()">📝 Text Post</button> <button onclick="showImagePost()">📷 Image Post</button><div id="textPostForm" style="display:none;margin-top:10px"><textarea id="shareText" placeholder="What's on your mind?"></textarea><button onclick="submitTextPost()" style="width:100%;margin-top:8px;padding:12px;background:#1877f2;color:#fff;border:0;border-radius:8px;font-weight:bold">📤 Publish</button></div><div id="imagePostForm" style="display:none;margin-top:10px"><select id="imageCategory" style="width:100%;padding:12px;border-radius:10px"><option value="">Select category</option><option>General</option><option>Funny</option><option>News</option><option>Islamic</option><option>Poetry</option><option>Help</option><option>Other</option></select><br><br><input id="shareImageInput" type="file" accept="image/*" onchange="shareImageSelected()"><img id="shareImagePreview" style="width:100%;display:none;margin-top:8px;border-radius:8px"><textarea id="imageCaption" placeholder="Write a caption..." style="margin-top:8px"></textarea><button onclick="submitImagePost()" style="width:100%;margin-top:8px;padding:12px;background:#1877f2;color:#fff;border:0;border-radius:8px;font-weight:bold">📷 Publish Image Post</button></div><button onclick="closeShare()" style="width:100%;margin-top:8px;padding:10px">Cancel</button></div></div>
<nav class="bottom-nav"><button class="active" onclick="goHome()">🏠<br>Home</button><button onclick="goPrivate()">💌<br>Private</button><button onclick="goMehfil()">👥<br>Mehfil</button><button onclick="goProfile()">👤<br>Profile</button><button onclick="goMore()">⚙️<br>More</button></nav>
</div>
<script>
"use strict";
// FIX 2: Agar CDN phir bhi fail ho to user ko blank loading nahi dikhega, error dikhega
window.addEventListener('error', function(e){
  var el=document.getElementById('jsError');
  if(el){ el.style.display='block'; el.textContent='JS Error: '+(e.message||'Unknown')+'\nPage refresh karo, agar phir bhi aaye to net check karo.'; }
});
function showJsError(msg){
  var el=document.getElementById('jsError');
  if(el){ el.style.display='block'; el.textContent=msg; }
  var f=document.getElementById('feed');
  if(f) f.innerHTML='<div class="empty">'+msg+'<br><button onclick="location.reload()">Try again</button></div>';
}
if(!window.supabase){
  showJsError('Supabase library load nahi hui. Net check karo ya CDN block hai. Page refresh karo.');
} else {
const SUPABASE_URL="https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_KEY="sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null,currentPosts=[],profileMap={},myActions={},postActionCounts={},postCommentCounts={};
function $(id){return document.getElementById(id)}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function formatDate(v){if(!v)return "";const d=new Date(v);const s=Math.max(0,Math.floor((Date.now()-d.getTime())/1000));if(s<60)return "Just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" hr ago";return d.toLocaleDateString()}
function timeout(p,ms=9000){let timer;return Promise.race([p,new Promise((_,rej)=>{timer=setTimeout(()=>rej(Error("Request timed out. Check internet / Supabase.")),ms)})]).finally(()=>clearTimeout(timer))}
async function init(){
  $("feed").innerHTML='<div class="loading">Checking your login…</div>';
  try{
    const r=await timeout(supabaseClient.auth.getSession(),10000);
    if(r.error) throw r.error;
    currentUser=r.data?.session?.user||null;
    if(!currentUser){ $("feed").innerHTML='<div class="empty">Please log in to open Home.<br><button onclick="location.href=\'login.html\'">Open Login</button></div>'; return; }
    await loadFeed();
    loadStories().catch(()=>{});
    loadOnlineUsers().catch(()=>{});
  }catch(e){ console.error(e); showJsError('ChatZone could not start: '+(e.message||e)); }
}
async function loadFeed(){
  $("feed").innerHTML='<div class="loading">Loading feed…</div>';
  try{
    let r=await timeout(supabaseClient.from("posts").select("id,user_id,content,created_at,post_type,category,image_url,voice_url").order("created_at",{ascending:false}).limit(50),12000);
    if(r.error) throw r.error;
    currentPosts=r.data||[];
    if(!currentPosts.length){ $("feed").innerHTML='<div class="empty">There are no posts yet.</div>'; return; }
    const ids=[...new Set(currentPosts.map(p=>p.user_id).filter(Boolean))];
    profileMap={}; postActionCounts={}; postCommentCounts={}; myActions={};
    if(ids.length){
      const pr=await timeout(supabaseClient.from("profiles").select("id,username,name,avatar_url").in("id",ids),8000);
      if(!pr.error) (pr.data||[]).forEach(x=>profileMap[x.id]=x);
    }
    const pids=currentPosts.map(p=>p.id);
    const a=await timeout(supabaseClient.from("post_actions").select("post_id,user_id,action_type").in("post_id",pids),8000);
    if(!a.error) (a.data||[]).forEach(x=>{ postActionCounts[x.post_id]??={like:0,dislike:0}; if(x.action_type==="like") postActionCounts[x.post_id].like++; if(x.action_type==="dislike") postActionCounts[x.post_id].dislike++; if(x.user_id===currentUser.id) myActions[x.post_id]=x.action_type; });
    const c=await timeout(supabaseClient.from("comments").select("post_id").in("post_id",pids),8000);
    if(!c.error) (c.data||[]).forEach(x=>postCommentCounts[x.post_id]=(postCommentCounts[x.post_id]||0)+1);
    $("feed").innerHTML=currentPosts.map(p=>renderPost(p)).join("");
  }catch(e){ console.error("Feed:",e); $("feed").innerHTML='<div class="empty">Could not load feed: '+esc(e.message)+'<br><button onclick="loadFeed()">Try again</button></div>'; }
}
function renderPost(p){
  const pr=profileMap[p.user_id]||{}, name=pr.name||pr.username||"Member", c=postActionCounts[p.id]||{like:0,dislike:0}, cc=postCommentCounts[p.id]||0, own=p.user_id===currentUser?.id, action=myActions[p.id];
  return '<article class="post"><div class="post-head">'+(pr.avatar_url?'<img class="avatar" src="'+esc(pr.avatar_url)+'">':'<div class="avatar"></div>')+'<div><b>'+esc(name)+'</b><br><small style="color:#65676b">'+formatDate(p.created_at)+'</small></div></div>'+(p.category?'<div style="margin-top:8px"><span style="background:#e7f3ff;color:#1877f2;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">#'+esc(p.category)+'</span></div>':'')+(p.content?'<div class="post-content">'+esc(p.content)+'</div>':'')+(p.image_url?'<img class="post-image" src="'+esc(p.image_url)+'">':'')+(p.voice_url?'<audio controls style="width:100%" src="'+esc(p.voice_url)+'"></audio>':'')+'<div class="post-actions">'+(own?'<button onclick="toggleComments(\''+p.id+'\')">💬 '+cc+'</button><button onclick="deletePost(\''+p.id+'\')">🗑 Delete</button>':'<button onclick="setPostAction(\''+p.id+'\',\'like\')">❤️ Like '+c.like+'</button><button onclick="setPostAction(\''+p.id+'\',\'dislike\')">👎 Dislike '+c.dislike+'</button><button onclick="toggleComments(\''+p.id+'\')">💬 '+cc+'</button>')+'</div><div id="comments-'+p.id+'" style="display:none;margin-top:10px"><div id="clist-'+p.id+'"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="cin-'+p.id+'" placeholder="Write a comment..." style="flex:1;padding:10px;border-radius:20px;border:0;background:#f0f2f5" onkeydown="if(event.key===\'Enter\')addComment(\''+p.id+'\')"><button onclick="addComment(\''+p.id+'\')">Send</button></div></div></article>';
}
async function setPostAction(id,type){
  try{
    const res=await timeout(supabaseClient.from("post_actions").select("id,action_type").eq("post_id",id).eq("user_id",currentUser.id).maybeSingle(),8000);
    if(res.error) throw res.error;
    const ex=res.data;
    if(ex && ex.action_type===type){ await timeout(supabaseClient.from("post_actions").delete().eq("id",ex.id),8000); }
    else if(ex){ await timeout(supabaseClient.from("post_actions").update({action_type:type}).eq("id",ex.id),8000); }
    else { await timeout(supabaseClient.from("post_actions").insert({post_id:id,user_id:currentUser.id,action_type:type}),8000); }
    await loadFeed();
  }catch(e){ alert("Reaction failed: "+e.message); }
}
async function toggleComments(id){
  const box=$("comments-"+id); box.style.display=box.style.display==="block"?"none":"block"; if(box.style.display==="none") return;
  const list=$("clist-"+id); list.textContent="Loading comments…";
  try{
    const r=await timeout(supabaseClient.from("comments").select("id,user_id,comment,created_at").eq("post_id",id).order("created_at"),8000);
    if(r.error) throw r.error;
    list.innerHTML=(r.data||[]).map(c=>'<div style="background:#f0f2f5;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:13px">'+esc(c.comment)+'</div>').join("")||"No comments yet.";
  }catch(e){ list.textContent="Comments load nahi huay: "+e.message; }
}
async function addComment(id){
  const input=$("cin-"+id), comment=input.value.trim(); if(!comment) return;
  try{ const r=await timeout(supabaseClient.from("comments").insert({post_id:id,user_id:currentUser.id,comment}),10000); if(r.error) throw r.error; input.value=""; await loadFeed(); }catch(e){ alert(e.message); }
}
async function createPost(){
  const content=$("postText").value.trim(); if(!content) return alert("Please write a post first.");
  try{ const r=await timeout(supabaseClient.from("posts").insert({user_id:currentUser.id,content,post_type:"text"}),10000); if(r.error) throw r.error; $("postText").value=""; await loadFeed(); }catch(e){ alert("Could not publish: "+e.message); }
}
async function submitTextPost(){
  const content=$("shareText").value.trim(); if(!content) return alert("Please enter text.");
  try{ const r=await timeout(supabaseClient.from("posts").insert({user_id:currentUser.id,content,post_type:"text"}),10000); if(r.error) throw r.error; $("shareText").value=""; closeShare(); await loadFeed(); }catch(e){ alert("Could not publish: "+e.message); }
}
function shareImageSelected(){ const f=$("shareImageInput").files?.[0]; if(!f) return; const rd=new FileReader(); rd.onload=e=>{ $("shareImagePreview").src=e.target.result; $("shareImagePreview").style.display="block"; }; rd.readAsDataURL(f); }
async function submitImagePost(){
  const f=$("shareImageInput").files?.[0], category=$("imageCategory").value, content=$("imageCaption").value.trim();
  if(!category||!f) return alert("Category aur image select karein.");
  try{
    const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg", path="posts/"+currentUser.id+"_"+Date.now()+"."+ext;
    const up=await timeout(supabaseClient.storage.from("post-images").upload(path,f,{upsert:false}),15000); if(up.error) throw up.error;
    const url=supabaseClient.storage.from("post-images").getPublicUrl(path).data.publicUrl;
    const r=await timeout(supabaseClient.from("posts").insert({user_id:currentUser.id,content,post_type:"image",category,image_url:url}),10000); if(r.error) throw r.error;
    closeShare(); await loadFeed();
  }catch(e){ alert("Could not publish image: "+e.message); }
}
async function deletePost(id){ if(!confirm("Delete your post?")) return; try{ const r=await timeout(supabaseClient.from("posts").delete().eq("id",id).eq("user_id",currentUser.id),10000); if(r.error) throw r.error; await loadFeed(); }catch(e){ alert("Delete failed: "+e.message); } }
function showShare(){ $("shareBox").style.display="block"; }
function closeShare(){ $("shareBox").style.display="none"; }
function showTextPost(){ $("textPostForm").style.display="block"; $("imagePostForm").style.display="none"; }
function showImagePost(){ $("shareBox").style.display="block"; $("imagePostForm").style.display="block"; $("textPostForm").style.display="none"; }
function startVoice(){ alert("Voice post is page me abhi off hai, pehle feed fix check karo."); }
function goHome(){ location.href="index.html"; } function goProfile(){ location.href="profile.html"; } function goPrivate(){ location.href="private.html"; } function goMehfil(){ location.href="mehfil.html"; } function goMore(){ location.href="more.html"; } function goNotifications(){ location.href="notifications.html"; }
async function loadStories(){
  const rail=$("storiesRail");
  try{
    const now=new Date().toISOString();
    const result=await timeout(supabaseClient.from("stories").select("id,user_id,video_url,caption,created_at,expires_at").gt("expires_at",now).order("created_at",{ascending:true}).limit(50),10000);
    if(result.error) throw result.error;
    const rows=result.data||[];
    if(!rows.length){ rail.innerHTML='<span style="color:#65676b;font-size:13px">No stories yet</span>'; return; }
    const ids=[...new Set(rows.map(s=>s.user_id))];
    const p=await timeout(supabaseClient.from("profiles").select("id,username,name,avatar_url").in("id",ids),8000);
    const map={}; (p.data||[]).forEach(x=>map[x.id]=x);
    rail.innerHTML=rows.map(s=>{ const u=map[s.user_id]||{}; return '<button class="story-tile" onclick="alert(\'Story viewer is purani file me tha, is fixed file me feed pehle check karo\')"><span class="story-ring">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'">':'👤')+'</span><br><small>'+esc(u.name||u.username||"Member")+'</small></button>'; }).join("");
  }catch(e){ rail.innerHTML='<span style="color:#65676b;font-size:13px">Stories load nahi huin</span>'; }
}
async function loadOnlineUsers(){
  try{
    const r=await timeout(supabaseClient.from("profiles").select("id,username,name,avatar_url").limit(10),8000);
    if(r.error) throw r.error;
    $("onlineCount").textContent=(r.data||[]).length;
    $("onlineUsers").innerHTML=(r.data||[]).map(u=>'<span style="background:#f0f2f5;border-radius:20px;padding:4px 10px;font-size:13px;display:inline-block;margin:2px">🟢 '+esc(u.username||u.name||"Member")+'</span>').join("")||"No users online";
  }catch(e){ $("onlineUsers").textContent="Online status unavailable"; }
}
init();
}
</script>
