<style>
:root{--bg:#171020;--panel:#241b30;--panel2:#2c2139;--line:#49365b;--text:#f7efff;--muted:#c6b5d8;--purple:#9860f5;--purple2:#b58aff;--green:#28c76f;--danger:#ef5350;--shadow:0 10px 28px #08040d66}

body.light{--bg:#f6f1fc;--panel:#fff;--panel2:#f1e9fb;--line:#ded0ed;--text:#241632;--muted:#756681;--shadow:0 8px 22px #3d245018}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#8b55ed,#b28aff);padding:16px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px #0003;min-height:112px;overflow-x:auto;scrollbar-width:none}.topbar::-webkit-scrollbar{display:none}.brand{font-weight:850;font-size:23px;white-space:nowrap;margin-right:auto;flex:0 0 auto}.top-actions{display:flex;gap:7px;align-items:center;min-width:0;flex-shrink:0}.top-btn{border:1px solid #ffffff75;background:#ffffffdf;color:#503276;border-radius:22px;min-width:78px;height:74px;padding:0 13px;font-weight:750;box-shadow:0 2px 5px #44206b25;position:relative;flex:0 0 auto}.top-btn.wide{font-size:13px}.top-btn .count{position:absolute;right:-4px;top:-7px;background:#e64e54;color:white;border-radius:50%;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center}.wrap{width:100%;max-width:760px;margin:0 auto;padding:20px 10px 24px}.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:30px;padding:23px;margin-bottom:24px;box-shadow:var(--shadow)}.online-title{font-size:25px;font-weight:800;margin-bottom:18px}.online-list{display:flex;gap:10px;overflow:auto;padding-bottom:3px}.online-user{display:flex;align-items:center;gap:9px;background:var(--panel2);padding:10px 14px;border-radius:34px;white-space:nowrap;font-size:19px}.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#47345d;border:4px solid #60467d;flex:0 0 auto}.dot{width:11px;height:11px;background:var(--green);border-radius:50%;display:inline-block}.welcome{text-align:center;font-size:28px;font-weight:850;padding:24px 10px}.section-title{font-size:25px;font-weight:850;margin:0 0 20px}.stories{display:flex;gap:22px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 10px;scrollbar-width:none;align-items:flex-start}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 118px;min-width:0;text-align:center;cursor:pointer}.story-ring{width:112px;height:112px;border-radius:50%;padding:5px;margin:0 auto 9px;background:linear-gradient(135deg,#a76cff,#6e42bd);display:grid;place-items:center;overflow:hidden}.story-ring img{width:100%;height:100%;max-width:100%;max-height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--panel)}
.story-ring img.avatar{width:100%;height:100%;min-width:0;min-height:0;display:block}
.story-ring .avatar{width:100%;height:100%;min-width:0;min-height:0;border-radius:50%;object-fit:cover}.story-name{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.add-story .story-ring{border:4px dashed #a66cff;background:var(--panel2);color:#c7a6ff;font-size:52px;font-weight:300}.composer{padding:24px}.composer-head{display:flex;align-items:center;gap:16px;margin-bottom:26px}.compose-icon{width:82px;height:82px;display:grid;place-items:center;background:linear-gradient(135deg,#a45dff,#8050d9);border-radius:27px;font-size:39px;box-shadow:0 6px 18px #8c4ce755}.composer h2{font-size:29px;margin:0;color:var(--purple2)}textarea{width:100%;min-height:220px;resize:vertical;border:2px solid var(--line);border-radius:34px;background:var(--panel2);color:var(--text);padding:30px;font-size:23px;outline:none}textarea:focus,input:focus{border-color:var(--purple)}.composer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.action-btn{border:1px solid var(--line);background:var(--panel2);padding:13px 16px;border-radius:24px;font-weight:750}.action-btn.primary{background:linear-gradient(135deg,#9b5df5,#7543d2);color:white;border:0;flex:1}.file-label{display:inline-flex;align-items:center;gap:7px}.feed-title{font-size:24px;font-weight:850;margin:25px 5px 15px}.post{padding:22px;width:100%;margin-left:0;margin-right:0}.post-head{display:flex;align-items:center;gap:11px}.post-head .avatar{width:48px;height:48px}.post-name{font-weight:800}.post-time{font-size:12px;color:var(--muted)}.post-text{font-size:19px;line-height:1.6;white-space:pre-wrap;margin:19px 0;overflow-wrap:anywhere}.post-image{width:100%;max-height:480px;object-fit:cover;border-radius:18px}.post-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}.post-actions button{background:var(--panel2);border:0;border-radius:22px;padding:12px 17px;font-size:17px}.comment-area{display:none;margin-top:12px}.comment-area.open{display:block}.comment-area input{width:100%;padding:12px 15px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.empty{text-align:center;color:var(--muted);padding:22px}.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 25px #08040d55}.nav-item{text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:72px;border-radius:18px;font-size:13px;font-weight:750}.nav-item span:first-child{font-size:20px}.nav-item.active{background:var(--panel2);color:var(--purple2)}.toast{position:fixed;z-index:50;left:50%;bottom:105px;transform:translateX(-50%);background:#30223d;color:white;padding:12px 18px;border-radius:20px;box-shadow:var(--shadow);display:none;max-width:90%;text-align:center}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:60;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-card{width:min(100%,520px);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px}.modal-card img{max-width:100%;max-height:65vh;object-fit:contain}.modal-close{float:right;border:0;background:var(--panel2);border-radius:50%;width:36px;height:36px;font-size:20px}
@media(max-width:480px){.topbar{padding:10px 8px;gap:6px;min-height:82px}.brand{font-size:17px}.top-actions{gap:5px}.top-btn{height:50px;min-width:45px;padding:0 8px;border-radius:16px}.top-btn.wide{font-size:11px}.wrap{padding:16px 8px 22px}.panel{padding:17px;border-radius:25px}.post{padding:19px 17px}.post-text{font-size:18px;line-height:1.6}.post-actions{gap:9px}.post-actions button{padding:12px 15px;font-size:16px}.online-title{font-size:21px}.online-user{font-size:16px;padding:8px 11px}.avatar{width:54px;height:54px}.welcome{font-size:23px;padding:20px 8px}.section-title{font-size:22px}.story{flex-basis:105px}.story-ring{width:100px;height:100px}.story-name{font-size:15px}.composer{padding:20px}.composer h2{font-size:25px}.compose-icon{width:72px;height:72px}textarea{font-size:20px;padding:24px;min-height:190px}}

/* wider mobile feed */
#feed{width:100%;min-width:0}
#feed .post{width:100%;max-width:none}
.post-actions button{white-space:nowrap}
@media(max-width:380px){.post-actions button{font-size:14px;padding:10px 12px}.post{padding:16px 13px}}

/* ChatZone phone layout: normal 1x scale, vertical feed, no oversized cards */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}
body {
  zoom: 1;
  -webkit-text-size-adjust: 100%;
}
.wrap, #feed, .panel, .post {
  width: 100%;
  max-width: 100%;
  min-width: 0;
}
#feed {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.post-image, video, audio {
  max-width: 100%;
}
@media (max-width: 600px) {
  .topbar {
    min-height: 64px;
    height: 64px;
    padding: 7px 9px;
    gap: 7px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
  }
  .brand {
    font-size: 16px;
    margin-right: 2px;
  }
  .top-actions { gap: 5px; }
  .top-btn {
    height: 42px;
    min-width: 42px;
    padding: 0 9px;
    border-radius: 13px;
    font-size: 15px;
  }
  .top-btn.wide {
    font-size: 11px;
    padding: 0 9px;
  }
  .wrap {
    padding: 12px 10px 18px;
  }
  .panel {
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 22px;
  }
  .online-title { font-size: 18px; margin-bottom: 12px; }
  .online-user { font-size: 14px; padding: 7px 10px; gap: 7px; }
  .avatar { width: 44px; height: 44px; border-width: 3px; }
  .welcome { font-size: 19px; padding: 17px 8px; }
  .section-title { font-size: 19px; margin-bottom: 13px; }
  .stories { gap: 13px; padding-bottom: 7px; }
  .story { flex: 0 0 82px; }
  .story-ring { width: 78px; height: 78px; padding: 4px; margin-bottom: 6px; }
  .story-name { font-size: 13px; }
  .composer { padding: 15px; }
  .composer-head { gap: 11px; margin-bottom: 16px; }
  .compose-icon { width: 54px; height: 54px; border-radius: 17px; font-size: 27px; }
  .composer h2 { font-size: 20px; }
  textarea {
    min-height: 145px;
    padding: 17px;
    border-radius: 22px;
    font-size: 16px;
  }
  .composer-actions { gap: 7px; }
  .action-btn { padding: 10px 12px; font-size: 13px; }
  .feed-title { font-size: 21px; margin: 18px 4px 12px; }
  .post { padding: 15px; margin-bottom: 15px; }
  .post-head .avatar { width: 42px; height: 42px; }
  .post-name { font-size: 15px; }
  .post-time { font-size: 11px; }
  .post-text { font-size: 16px; line-height: 1.5; margin: 13px 0; }
  .post-actions { gap: 7px; padding-top: 10px; }
  .post-actions button { padding: 9px 11px; font-size: 13px; border-radius: 17px; }
  .bottom-nav {
    padding: 6px 5px calc(6px + env(safe-area-inset-bottom));
    gap: 2px;
  }
  .nav-item { min-height: 62px; font-size: 11px; border-radius: 14px; }
  .nav-item span:first-child { font-size: 18px; }
}
@media (max-width: 360px) {
  .brand { font-size: 14px; }
  .top-btn.wide { font-size: 10px; }
  .post-actions button { padding: 8px 9px; font-size: 12px; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">ChatZone 💬</div>
  <div class="top-actions">
    <button class="top-btn wide" onclick="showToast('Trending posts coming soon')">🔥 Trending</button>
    <button class="top-btn wide" onclick="sharePage()">📤 Share</button>
    <button class="top-btn" title="Stars" onclick="showToast('ChatZone Stars ⭐')">⭐</button>
    <button class="top-btn" title="Notifications" onclick="location.href='notifications.html'">🔔<span class="count" id="noticeCount" hidden>0</span></button>
    <button class="top-btn" title="Theme" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="online-title">🟢 <span id="onlineCount">0</span> Users Online</div>
    <div class="online-list" id="onlineList"><div class="empty">Loading online users...</div></div>
  </section>

  <section class="panel welcome">👋 Welcome to ChatZone! 💜💬</section>

  <section class="panel">
    <h2 class="section-title">🔴 Stories</h2>
    <div class="stories" id="storiesList">
      <div class="story add-story" onclick="document.getElementById('storyFile').click()">
        <div class="story-ring">+</div><div class="story-name">Your story</div>
      </div>
    </div>
    <input type="file" id="storyFile" accept="image/*,video/*" hidden onchange="uploadStory(this.files[0])">
  </section>

  <section class="panel composer">
    <div class="composer-head"><div class="compose-icon">✍️</div><h2>Create a Post ✨</h2></div>
    <textarea id="postText" placeholder="What's on your mind?"></textarea>
    <div class="composer-actions">
      <label class="action-btn file-label">🖼️ Image <input id="postImage" type="file" accept="image/*" hidden></label>
      <label class="action-btn file-label">🎙️ Voice <input id="postVoice" type="file" accept="audio/*" hidden></label>
      <button class="action-btn primary" id="sendPostBtn" onclick="createPost()">Send Post ➤</button>
    </div>
    <div id="selectedFile" class="post-time" style="margin-top:10px"></div>
  </section>

  <h2 class="feed-title">✨ Recent Posts</h2>
  <div id="feed"><section class="panel empty">Loading posts...</section></div>
</main>

<nav class="bottom-nav">
  <a class="nav-item active" href="index.html"><span>🏠</span>Home</a>
  <a class="nav-item" href="private.html"><span>💌</span>Private</a>
  <a class="nav-item" href="mehfil.html"><span>👥</span>Mehfil</a>
  <a class="nav-item" href="profile.html"><span>👤</span>Profile</a>
  <a class="nav-item" href="more.html"><span>⚙️</span>More</a>
</nav>

<div class="toast" id="toast"></div>
<div class="modal" id="storyModal" onclick="if(event.target===this)closeStory()">
  <div class="modal-card"><button class="modal-close" onclick="closeStory()">×</button><div id="storyContent"></div></div>
</div>

<script>
const SUPABASE_URL = "https://jhcpqjmxiovvqbghpxbf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_88PQK2ur0Xe3uXTK2faKNQ_A7FrZlA8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
let currentUser=null, currentProfile=null, postImageFile=null, postVoiceFile=null;

const $ = id => document.getElementById(id);
function showToast(message){const t=$('toast');t.textContent=message;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2600)}
function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatarUrl(profile){return profile?.avatar_url||profile?.avatar||profile?.photo_url||profile?.profile_image||''}
function displayName(profile){return profile?.username||profile?.full_name||profile?.name||'ChatZone User'}
function toggleTheme(){document.body.classList.toggle('light');const light=document.body.classList.contains('light');localStorage.setItem('chatzone-home-theme-v2',light?'light':'dark');$('themeBtn').textContent=light?'🌙':'☀️'}
// Start in the dark purple reference style. Theme changes made on this version are remembered separately.
if(localStorage.getItem('chatzone-home-theme-v2')==='light'){document.body.classList.add('light');$('themeBtn').textContent='🌙'}
async function sharePage(){try{if(navigator.share)await navigator.share({title:'ChatZone',url:location.href});else{await navigator.clipboard.writeText(location.href);showToast('Link copied!')}}catch(e){}}
function initials(name){return safe((name||'U').trim().slice(0,1).toUpperCase())}
function avatar(profile,cls='avatar'){const url=avatarUrl(profile);return url?`<img class="${cls}" src="${safe(url)}" alt="" onerror="this.style.display='none'">`:`<div class="${cls}" style="display:grid;place-items:center">${initials(displayName(profile))}</div>`}

async function init(){
  const {data:{session},error}=await db.auth.getSession();
  if(error)console.warn(error);
  if(!session){location.replace('login.html');return}
  currentUser=session.user;
  const {data:profile}=await db.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  currentProfile=profile||{id:currentUser.id,username:currentUser.email?.split('@')[0]||'User'};
  await Promise.allSettled([loadOnline(),loadStories(),loadPosts(),loadNotifications()]);
  db.channel('home-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>loadPosts())
    .on('postgres_changes',{event:'*',schema:'public',table:'stories'},()=>loadStories())
    .subscribe();
}
async function loadOnline(){
  const {data,error}=await db.from('profiles').select('*').limit(40);
  if(error){$('onlineList').innerHTML='<div class="empty">Online users are unavailable right now.</div>';return}
  const users=(data||[]).filter(p=>p.id!==currentUser.id && (p.is_online===true||p.online===true||p.status==='online'));
  $('onlineCount').textContent=users.length+(currentProfile?1:0);
  const all=[currentProfile,...users].filter(Boolean);
  $('onlineList').innerHTML=all.length?all.map(p=>`<div class="online-user">${avatar(p)}<span class="dot"></span>${safe(displayName(p))}</div>`).join(''):'<div class="empty">No users online</div>';
}
async function loadStories(){
  const {data,error}=await db.from('stories').select('*').order('created_at',{ascending:false}).limit(30);
  if(error){console.warn('Stories:',error.message);return}
  const ids=[...new Set((data||[]).map(s=>s.user_id||s.owner_id).filter(Boolean))];
  let profiles={};
  if(ids.length){const r=await db.from('profiles').select('*').in('id',ids);(r.data||[]).forEach(p=>profiles[p.id]=p)}
  const own=(data||[]).filter(s=>(s.user_id||s.owner_id)===currentUser.id);
  const other=(data||[]).filter(s=>(s.user_id||s.owner_id)!==currentUser.id);
  const add=`<div class="story add-story" onclick="document.getElementById('storyFile').click()"><div class="story-ring">+</div><div class="story-name">Your story</div></div>`;
  $('storiesList').innerHTML=add+other.map(s=>{const p=profiles[s.user_id||s.owner_id]||{};const media=s.media_url||s.image_url||s.video_url||s.url||'';return `<div class="story" onclick="openStory('${safe(s.id)}','${safe(media)}','${safe(displayName(p))}')"><div class="story-ring">${avatar(p,'avatar')}</div><div class="story-name">${safe(displayName(p))}</div></div>`}).join('')+(own.length?own.map(s=>{const media=s.media_url||s.image_url||s.video_url||s.url||'';return `<div class="story" onclick="openStory('${safe(s.id)}','${safe(media)}','Your story')"><div class="story-ring">${avatar(currentProfile,'avatar')}</div><div class="story-name">Your story</div></div>`}).join(''):'');
}
function openStory(id,url,name){$('storyContent').innerHTML=`<h3>${safe(name)}</h3>${url?(/\.(mp4|webm|mov)(\?|$)/i.test(url)?`<video src="${safe(url)}" controls autoplay playsinline style="width:100%"></video>`:`<img src="${safe(url)}" alt="Story">`):'<p>Story media unavailable.</p>'}`;$('storyModal').classList.add('show')}
function closeStory(){$('storyModal').classList.remove('show')}
async function uploadStory(file){
  if(!file)return;
  try{const ext=file.name.split('.').pop()||'jpg',path=`${currentUser.id}/${Date.now()}.${ext}`;
    const up=await db.storage.from('stories').upload(path,file,{upsert:false});
    if(up.error)throw up.error;
    const {data:{publicUrl}}=db.storage.from('stories').getPublicUrl(path);
    const ins=await db.from('stories').insert({user_id:currentUser.id,media_url:publicUrl,created_at:new Date().toISOString()});
    if(ins.error)throw ins.error;showToast('Story uploaded!');loadStories();
  }catch(e){console.error(e);showToast('Story upload failed: '+(e.message||'Check storage/table permissions'))}
}
$('postImage').addEventListener('change',e=>{postImageFile=e.target.files[0]||null;updateFiles()});
$('postVoice').addEventListener('change',e=>{postVoiceFile=e.target.files[0]||null;updateFiles()});
function updateFiles(){$('selectedFile').textContent=[postImageFile?.name,postVoiceFile?.name].filter(Boolean).join(' · ')}
async function createPost(){
  const content=$('postText').value.trim();if(!content&&!postImageFile&&!postVoiceFile){showToast('Write something or select a file first');return}
  const btn=$('sendPostBtn');btn.disabled=true;btn.textContent='Posting...';
  try{
    let image_url=null,voice_url=null;
    if(postImageFile){const path=`${currentUser.id}/${Date.now()}_${postImageFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await db.storage.from('post-images').upload(path,postImageFile);if(up.error)throw up.error;image_url=db.storage.from('post-images').getPublicUrl(path).data.publicUrl}
    if(postVoiceFile){const path=`${currentUser.id}/${Date.now()}_${postVoiceFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await db.storage.from('voice-posts').upload(path,postVoiceFile);if(up.error)throw up.error;voice_url=db.storage.from('voice-posts').getPublicUrl(path).data.publicUrl}
    const row={user_id:currentUser.id,content,created_at:new Date().toISOString()};
    if(image_url)row.image_url=image_url;if(voice_url)row.voice_url=voice_url;
    const result=await db.from('posts').insert(row);
    if(result.error)throw result.error;
    $('postText').value='';$('postImage').value='';$('postVoice').value='';postImageFile=null;postVoiceFile=null;updateFiles();showToast('Post shared successfully!');await loadPosts();
  }catch(e){console.error(e);showToast('Could not post: '+(e.message||'Check posts table/storage permissions'))}
  finally{btn.disabled=false;btn.textContent='Send Post ➤'}
}
async function loadPosts(){
  const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false}).limit(40);
  if(error){$('feed').innerHTML='<section class="panel empty">Posts could not be loaded. Check the posts table permissions.</section>';console.warn(error);return}
  const posts=data||[];if(!posts.length){$('feed').innerHTML='<section class="panel empty">No posts yet. Be the first to share something! 💜</section>';return}
  const ids=[...new Set(posts.map(p=>p.user_id).filter(Boolean))];let profiles={};
  if(ids.length){const r=await db.from('profiles').select('*').in('id',ids);(r.data||[]).forEach(p=>profiles[p.id]=p)}
  $('feed').innerHTML=posts.map(p=>{
    const profile=profiles[p.user_id]||{},name=displayName(profile),date=p.created_at?new Date(p.created_at).toLocaleString():'';
    const content=p.content||p.body||p.text||'';
    const img=p.image_url||p.image||p.media_url||'';
    const voice=p.voice_url||p.audio_url||'';
    return `<article class="panel post"><div class="post-head">${avatar(profile)}<div><div class="post-name">${safe(name)}</div><div class="post-time">${safe(date)}</div></div></div><div class="post-text">${safe(content)}</div>${img?`<img class="post-image" src="${safe(img)}" alt="Post image">`:''}${voice?`<audio controls src="${safe(voice)}" style="width:100%;margin:8px 0"></audio>`:''}<div class="post-actions"><button onclick="reactPost('${safe(p.id)}','like')">❤️ Like</button><button onclick="reactPost('${safe(p.id)}','dislike')">👎 Dislike</button><button onclick="toggleComment('${safe(p.id)}')">💬 Comment</button><button onclick="sharePost('${safe(p.id)}')">📤 Share</button></div><div class="comment-area" id="comments-${safe(p.id)}"><input id="comment-input-${safe(p.id)}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')sendComment('${safe(p.id)}')"><button class="action-btn" style="margin-top:8px" onclick="sendComment('${safe(p.id)}')">Send</button><div id="comment-list-${safe(p.id)}"></div></div></article>`
  }).join('');
}
async function reactPost(postId,action){
  try{const {error}=await db.from('post_actions').upsert({post_id:postId,user_id:currentUser.id,action},{onConflict:'post_id,user_id'});if(error)throw error;showToast(action==='like'?'Liked ❤️':'Reaction saved');}
  catch(e){console.warn(e);showToast('Reaction could not be saved')}
}
async function toggleComment(id){const box=$('comments-'+id);box.classList.toggle('open');if(box.classList.contains('open'))loadComments(id)}
async function loadComments(id){
  const target=$('comment-list-'+id);const {data,error}=await db.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true}).limit(30);
  if(error){target.innerHTML='<div class="post-time">Comments unavailable.</div>';return}
  target.innerHTML=(data||[]).map(c=>`<div class="post-time" style="padding:8px 2px"><b>${safe(c.username||c.name||'User')}:</b> ${safe(c.content||c.comment||c.text||'')}</div>`).join('');
}
async function sendComment(id){
  const input=$('comment-input-'+id),content=input.value.trim();if(!content)return;
  try{const {error}=await db.from('comments').insert({post_id:id,user_id:currentUser.id,content,created_at:new Date().toISOString()});if(error)throw error;input.value='';loadComments(id);showToast('Comment added')}
  catch(e){console.warn(e);showToast('Comment could not be sent')}
}
async function sharePost(id){const url=location.origin+location.pathname+'#post-'+id;try{if(navigator.share)await navigator.share({title:'ChatZone post',url});else{await navigator.clipboard.writeText(url);showToast('Post link copied')}}catch(e){}}
async function loadNotifications(){
  const {count,error}=await db.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',currentUser.id).eq('is_read',false);
  if(!error&&count>0){$('noticeCount').hidden=false;$('noticeCount').textContent=count>9?'9+':count}
}
init();
</script>
</body>
</html>
