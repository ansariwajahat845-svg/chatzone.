    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="theme-color" content="#21006d" />
      <title>ChatZone — Connect • Share • Chat</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <style>
        :root{--deep:#180052;--purple:#6500f5;--violet:#9b20ff;--ink:#17104c;--muted:#7469a9;--line:#e5d8ff;--surface:#fff;--bg:#f7f3ff}
        *{box-sizing:border-box} html{scroll-behavior:smooth}
        body{margin:0;background:linear-gradient(155deg,#240078 0%,#7800ff 36%,#f3eaff 36%,#faf8ff 100%);font-family:Nunito,system-ui,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:100px}
        button,input,textarea{font:inherit}button{cursor:pointer}
        .app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#25006e 0,#5c00ec 235px,#f8f5ff 420px);overflow:hidden;position:relative}
        .top{padding:18px 18px 12px;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:58px;height:58px;border-radius:22px 22px 22px 7px;background:linear-gradient(145deg,#ef68ff,#8d13ff);display:grid;place-items:center;font-size:29px;box-shadow:0 7px 25px #a52bff70}
        .brand h1{font-size:clamp(27px,7vw,40px);line-height:1;margin:0;font-weight:900;letter-spacing:-1.5px}.brand h1 span{color:#d77aff}.tagline{font-size:13px;color:#e7d6ff;margin-top:5px;font-weight:700}
        .user-avatar{width:56px;height:56px;border:3px solid white;border-radius:50%;object-fit:cover;background:#d8c8ff;flex-shrink:0}
        .top-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 14px 14px}
        .top-tab{border:1px solid #ffffffa8;background:#fff;color:#21105f;border-radius:25px;padding:11px 4px 10px;min-height:83px;box-shadow:0 5px 15px #29008024;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
        .top-tab .ico{font-size:25px;line-height:1.1}.top-tab strong{font-size:16px;font-weight:900}.top-tab small{font-size:10px;font-weight:800;color:#71659f}
        .top-tab.active{background:linear-gradient(140deg,#8e00ff,#4b00d8);color:white;border:2px solid #e7caff;box-shadow:0 8px 20px #7b18ed55}.top-tab.active small{color:#eee1ff}
        main{padding:0 12px 20px}
        .panel{background:rgba(255,255,255,.96);border:1px solid #e8dcff;border-radius:27px;box-shadow:0 6px 18px #6a20d51b;margin-bottom:13px}
        .online{padding:12px 14px 13px}.online-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900;margin-bottom:9px}.green-dot{width:14px;height:14px;background:#13d77b;border-radius:50%;box-shadow:0 0 0 4px #d9ffeb}
        .avatars{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}.avatars::-webkit-scrollbar{display:none}.friend{position:relative;flex:0 0 48px;height:48px}.friend img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #e3d4ff;background:#eee}.friend i{position:absolute;right:0;bottom:0;width:12px;height:12px;background:#13d77b;border:2px solid white;border-radius:50%}
        .composer{padding:13px}.compose-row{display:flex;align-items:center;gap:10px}.my-avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#e4d8ff;flex-shrink:0}.compose-input{width:100%;border:1px solid #e5d9ff;border-radius:30px;background:#f5f0ff;padding:15px 17px;color:var(--ink);outline:none;font-weight:800}.compose-input:focus{border-color:#9b51ff}
        .compose-actions{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:7px;margin-top:12px}.chip-btn{border:0;border-radius:24px;padding:10px 5px;font-weight:900;font-size:13px;background:#eaf1ff;color:#1262d8}.chip-btn.star{background:#fff2d9;color:#ed9300}.chip-btn.text{background:#e1f8ed;color:#0b9a5a}.chip-btn.post{background:linear-gradient(130deg,#a100ff,#5100df);color:white;box-shadow:0 5px 12px #7818e84a}
        .categories{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.category{white-space:nowrap;border:1px solid #ddccff;border-radius:25px;background:#f0e8ff;padding:10px 15px;font-size:13px;font-weight:900;color:#25105f}.category.active{background:linear-gradient(135deg,#a000ff,#5a00df);color:white;border-color:transparent}
        .sort-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 2px 13px;background:#eee5ff;border-radius:28px;padding:4px}.sort{border:0;background:transparent;color:#24115e;border-radius:25px;padding:11px 4px;font-size:14px;font-weight:900}.sort.active{background:linear-gradient(130deg,#a000ff,#5900df);color:white;box-shadow:0 4px 12px #7518dc44}
        .post{padding:13px;margin-bottom:13px}.post-head{display:flex;align-items:center;gap:10px}.post-avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#e7ddff}.post-user{min-width:0;flex:1}.post-user strong{font-size:16px;font-weight:900}.post-meta{font-size:12px;color:#7567a9;font-weight:800;margin-top:2px}.verified{color:#7624ed}.dots{border:0;background:transparent;color:#6750a7;font-size:23px;letter-spacing:2px}
        .post-content{font-size:17px;font-weight:800;line-height:1.45;margin:13px 3px 15px;overflow-wrap:anywhere}.post-image{width:100%;max-height:290px;object-fit:cover;border-radius:18px;margin:0 0 12px}
        .post-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.action{border:1px solid #e4d4ff;background:#f3ebff;color:#6500dc;border-radius:15px;padding:9px 2px;font-size:11px;font-weight:900;min-width:0}.action span{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}.action.like{background:#fff0f5;color:#e51d58;border-color:#ffd2e1}.action.chat{background:#edf3ff;color:#0758e8}.action.report{background:#fff5e6;color:#ed8500}.action.liked{background:#ffe0eb;border-color:#ff8bb4}
        .empty{padding:24px;text-align:center;color:#7d70a7;font-weight:800}.status{position:fixed;left:50%;transform:translateX(-50%);bottom:91px;background:#1e075c;color:white;border-radius:18px;padding:8px 13px;font-size:12px;z-index:30;box-shadow:0 5px 18px #26006c55;display:none;max-width:90%;text-align:center}
        .bottom-wrap{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#f8f4ff00,#eee5ff 35%);pointer-events:none}
        .bottom{pointer-events:auto;max-width:740px;margin:auto;background:#fff;border:1px solid #e8dcff;border-radius:28px;box-shadow:0 8px 25px #4e0aa83a;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px 7px}
        .bottom button{border:0;background:transparent;color:#1f145d;font-weight:900;font-size:12px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:1px}.bottom .bico{font-size:24px;line-height:1.1}.bottom button.active{color:#7400ed}
        .hidden{display:none!important}
        @media(min-width:650px){body{padding:18px 0 110px}.app{border-radius:28px;box-shadow:0 20px 70px #21005a66}.top{padding:24px}.top-tab{min-height:92px}.post-content{font-size:19px}.bottom-wrap{bottom:12px}.bottom{border-radius:24px}}
        @media(max-width:370px){.brand h1{font-size:27px}.logo{width:48px;height:48px}.top-tab strong{font-size:14px}.top-tab small{font-size:9px}.compose-actions{gap:4px}.chip-btn{font-size:11px}.post-actions{gap:4px}.action{font-size:10px}}
      </style>
    </head>
    <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="logo">•••</div>
          <div><h1>Chat<span>Zone</span></h1><div class="tagline">Connect • Share • Chat ❤️</div></div>
        </div>
        <img id="headerAvatar" class="user-avatar" src="https://i.pravatar.cc/120?img=12" alt="Profile">
      </header>

      <nav class="top-tabs" aria-label="Main feed sections">
        <button class="top-tab active" data-feed="for-me"><span class="ico">👥</span><strong>For Me</strong><small>My Followers Posts</small></button>
        <button class="top-tab" data-feed="stars"><span class="ico">⭐</span><strong>Stars</strong><small>Red Star Users</small></button>
        <button class="top-tab" data-feed="explore"><span class="ico">🧭</span><strong>Explore</strong><small>All Categories</small></button>
      </nav>

      <main>
        <section class="panel online">
          <div class="online-head"><span class="green-dot"></span><span>Online Friends</span><span id="onlineCount">12</span></div>
          <div class="avatars" id="onlineFriends">
            <div class="friend"><img src="https://i.pravatar.cc/100?img=12"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img=13"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img=14"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img=15"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img= 여자"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img=17"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img=18"><i></i></div>
            <div class="friend"><img src="https://i.pravatar.cc/100?img=19"><i></i></div>
          </div>
        </section>

        <section class="panel composer">
          <div class="compose-row">
            <img id="composerAvatar" class="my-avatar" src="https://i.pravatar.cc/100?img=12" alt="">
            <input id="postText" class="compose-input" type="text" maxlength="1000" placeholder="What's on your mind?">
          </div>
          <div class="compose-actions">
            <button class="chip-btn" id="imageMode">▣ Images</button>
            <button class="chip-btn star" id="starMode">⭐ Stars</button>
            <button class="chip-btn text" id="textMode">▧ Text</button>
            <button class="chip-btn post" id="publishBtn">➤ Post</button>
          </div>
          <input id="imageUrl" class="compose-input hidden" style="margin-top:9px" type="url" placeholder="Paste image URL (optional)">
        </section>

        <div class="categories" id="categories">
          <button class="category active" data-category="All">▦ All</button>
          <button class="category" data-category="Poetry">🍃 Poetry</button>
          <button class="category" data-category="Romantic">♥ Romantic</button>
          <button class="category" data-category="Sad">☹ Sad</button>
          <button class="category" data-category="Funny">😂 Funny</button>
          <button class="category" data-category="Love">❤️ Love</button>
          <button class="category" data-category="Quotes">✦ Quotes</button>
          <button class="category" data-category="Attitude">😎 Attitude</button>
        </div>

        <div class="sort-tabs">
          <button class="sort active" data-sort="trending">🔥 Trending Posts</button>
          <button class="sort" data-sort="latest">⭐ Latest Posts</button>
        </div>

        <section id="feed">
          <article class="panel post">
            <div class="post-head"><img class="post-avatar" src="https://i.pravatar.cc/120?img=12"><div class="post-user"><strong>Horeenkhan <span class="verified">✔</span></strong><div class="post-meta">Top 2 🔥 · Just now</div></div><button class="dots">•••</button></div>
            <div class="post-content">mein theek ho ap sonaao kese hoo sis 🤣🤣🤣🤣😁😁😁</div>
            <div class="post-actions"><button class="action"><span>👥</span>Follow</button><button class="action like"><span>❤️</span>Like</button><button class="action chat"><span>💬</span>1 ON 1</button><button class="action"><span>↪</span>Replies 0</button><button class="action report"><span>⚠️</span>Report</button></div>
          </article>
          <article class="panel post">
            <div class="post-head"><img class="post-avatar" src="https://i.pravatar.cc/120?img=33"><div class="post-user"><strong>ahil_66</strong><div class="post-meta">Top 4 ⭐ · Just now</div></div><button class="dots">•••</button></div>
            <div class="post-content">😜😜😜😜😜 U rupa ho 🤣🤣🤣🤣</div>
            <div class="post-actions"><button class="action"><span>👥</span>Follow</button><button class="action like"><span>❤️</span>Like</button><button class="action chat"><span>💬</span>1 ON 1</button><button class="action"><span>↪</span>Replies 0</button><button class="action report"><span>⚠️</span>Report</button></div>
          </article>
        </section>
      </main>
    </div>

    <div id="status" class="status" role="status"></div>
    <div class="bottom-wrap">
      <nav class="bottom" aria-label="Bottom navigation">
        <button class="active" data-bottom="Home"><span class="bico">⌂</span>Home</button>
        <button data-bottom="1 ON 1"><span class="bico">☏</span>1 ON 1</button>
        <button data-bottom="Inbox"><span class="bico">✉</span>Inbox</button>
        <button data-bottom="Profile"><span class="bico">♙</span>Profile</button>
        <button data-bottom="More"><span class="bico">•••</span>More</button>
      </nav>
    </div>

    <script>
    /* ==========================================================
       SUPABASE CONNECTION
       1) Paste your Supabase Project URL below.
       2) Paste your Supabase anon/public key below.
       Never put your service_role key in browser HTML.
       ========================================================== */
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_PUBLIC_KEY";

    let supabaseClient = null;
    let currentUser = null;
    let selectedFeed = "for-me";
    let selectedCategory = "All";
    let selectedSort = "trending";
    let postType = "text";

    const $ = (id) => document.getElementById(id);
    const statusBox = $("status");
    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.style.display = "block";
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => statusBox.style.display = "none", 3000);
    }
    function escapeHTML(value="") {
      return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function timeAgo(dateValue) {
      const date = new Date(dateValue || Date.now());
      const seconds = Math.max(0, Math.floor((Date.now()-date.getTime())/1000));
      if(seconds < 60) return "Just now";
      if(seconds < 3600) return Math.floor(seconds/60)+"m ago";
      if(seconds < 86400) return Math.floor(seconds/3600)+"h ago";
      return Math.floor(seconds/86400)+"d ago";
    }

    async function connectSupabase() {
      if (!window.supabase || SUPABASE_URL.includes("YOUR_") || SUPABASE_ANON_KEY.includes("YOUR_")) {
        showStatus("Supabase keys add karein — demo design abhi show ho raha hai.");
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await supabaseClient.auth.getSession();
        currentUser = session?.user || null;
        if (currentUser) {
          const avatar = currentUser.user_metadata?.avatar_url;
          if (avatar) { $("headerAvatar").src = avatar; $("composerAvatar").src = avatar; }
        }
        await loadPosts();
        supabaseClient.auth.onAuthStateChange((_event, session) => {
          currentUser = session?.user || null;
        });
        showStatus("Supabase connected successfully.");
      } catch (error) {
        console.error(error);
        showStatus("Supabase connection error. URL/key check karein.");
      }
    }

    function renderPosts(posts) {
      const feed = $("feed");
      if (!posts || !posts.length) {
        feed.innerHTML = '<div class="panel empty">Abhi is section mein koi post nahi. Pehli post aap share karein! 💜</div>';
        return;
      }
      feed.innerHTML = posts.map(post => {
        const name = escapeHTML(post.username || "ChatZone User");
        const content = escapeHTML(post.content || "");
        const avatar = escapeHTML(post.avatar_url || "https://i.pravatar.cc/120?img=12");
        const image = post.image_url ? `<img class="post-image" src="${escapeHTML(post.image_url)}" alt="Post image" loading="lazy">` : "";
        const category = escapeHTML(post.category || "All");
        return `<article class="panel post" data-post-id="${escapeHTML(post.id)}">
          <div class="post-head"><img class="post-avatar" src="${avatar}" alt=""><div class="post-user"><strong>${name} ${post.has_red_star ? '<span class="verified">⭐</span>' : ''}</strong><div class="post-meta">${category} · ${timeAgo(post.created_at)}</div></div><button class="dots" aria-label="More options">•••</button></div>
          <div class="post-content">${content}</div>${image}
          <div class="post-actions"><button class="action follow"><span>👥</span>Follow</button><button class="action like"><span>❤️</span>Like</button><button class="action chat"><span>💬</span>1 ON 1</button><button class="action replies"><span>↪</span>Replies ${Number(post.replies_count || 0)}</button><button class="action report"><span>⚠️</span>Report</button></div>
        </article>`;
      }).join("");
      bindPostActions();
    }

    async function loadPosts() {
      if (!supabaseClient) return;
      let query = supabaseClient.from("posts").select("*").order("created_at", { ascending: selectedSort === "latest" }).limit(40);
      if (selectedCategory !== "All") query = query.eq("category", selectedCategory);
      if (selectedFeed === "stars") query = query.eq("has_red_star", true);
      if (selectedFeed === "for-me" && currentUser) {
        // Optional: create a followed_users table and apply your own follower filter here.
      }
      const { data, error } = await query;
      if (error) {
        console.error(error);
        showStatus("Posts load nahi huay. Table/columns check karein.");
        return;
      }
      renderPosts(data);
    }

    async function publishPost() {
      const content = $("postText").value.trim();
      const imageUrl = $("imageUrl").value.trim();
      if (!content && !imageUrl) { showStatus("Pehle post text ya image URL add karein."); return; }
      if (!supabaseClient) { showStatus("Pehle Supabase URL aur anon key add karein."); return; }
      if (!currentUser) { showStatus("Post karne ke liye user ko sign in karna hoga."); return; }
      const payload = {
        user_id: currentUser.id,
        username: currentUser.user_metadata?.username || currentUser.user_metadata?.full_name || currentUser.email?.split("@")[0] || "User",
        avatar_url: currentUser.user_metadata?.avatar_url || null,
        content,
        image_url: imageUrl || null,
        category: selectedCategory === "All" ? "General" : selectedCategory,
        post_type: postType,
        has_red_star: false
      };
      const { error } = await supabaseClient.from("posts").insert(payload);
      if (error) { console.error(error); showStatus("Post publish nahi hui. Database policy check karein."); return; }
      $("postText").value = ""; $("imageUrl").value = "";
      await loadPosts();
      showStatus("Your post is live! 💜");
    }

    function bindPostActions() {
      document.querySelectorAll(".action.like").forEach(btn => btn.addEventListener("click", () => {
        btn.classList.toggle("liked");
        btn.innerHTML = btn.classList.contains("liked") ? "<span>❤️</span>Liked" : "<span>❤️</span>Like";
      }));
      document.querySelectorAll(".action.chat").forEach(btn => btn.addEventListener("click", () => showStatus("1 ON 1 chat ke liye Inbox/Auth feature connect karein.")));
      document.querySelectorAll(".action.follow").forEach(btn => btn.addEventListener("click", () => { btn.textContent = btn.textContent.includes("Following") ? "Follow" : "Following"; }));
      document.querySelectorAll(".action.report").forEach(btn => btn.addEventListener("click", () => showStatus("Report feature ko moderation table/API se connect karna hoga.")));
      document.querySelectorAll(".action.replies").forEach(btn => btn.addEventListener("click", () => showStatus("Replies feature ke liye comments table add karein.")));
    }

    document.querySelectorAll(".top-tab").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".top-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active"); selectedFeed = btn.dataset.feed; loadPosts();
    }));
    document.querySelectorAll(".category").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".category").forEach(b => b.classList.remove("active"));
      btn.classList.add("active"); selectedCategory = btn.dataset.category; loadPosts();
    }));
    document.querySelectorAll(".sort").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".sort").forEach(b => b.classList.remove("active"));
      btn.classList.add("active"); selectedSort = btn.dataset.sort; loadPosts();
    }));
    document.querySelectorAll(".bottom button").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".bottom button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const section = btn.dataset.bottom;
      if(section !== "Home") showStatus(section + " section ko next backend step mein connect kiya ja sakta hai.");
    }));
    $("publishBtn").addEventListener("click", publishPost);
    $("imageMode").addEventListener("click", () => { postType="image"; $("imageUrl").classList.toggle("hidden"); $("imageUrl").focus(); });
    $("starMode").addEventListener("click", () => { postType="star"; showStatus("Star post type selected."); });
    $("textMode").addEventListener("click", () => { postType="text"; $("imageUrl").classList.add("hidden"); $("postText").focus(); });

    connectSupabase();
    </script>
    </body>
    </html>
